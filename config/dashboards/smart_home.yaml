title: Smart Home Control
views:
  - title: Home
    path: home
    icon: mdi:home
    badges: []
    cards:
      # Welcome Header
      - type: markdown
        content: |
          # Welcome Home, {{ user }}!
          {{ states('weather.forecast_home') | title }} · {{ state_attr('weather.forecast_home', 'temperature') }}°C

      # Weather Card
      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: true
        forecast_type: daily

      # Sun Position
      - type: entities
        title: Sun & Time
        icon: mdi:weather-sunny
        entities:
          - entity: sun.sun
            name: Sun Position
          - entity: sensor.sun_next_rising
            name: Sunrise
          - entity: sensor.sun_next_setting
            name: Sunset

      # Person Tracking
      - type: entities
        title: People
        icon: mdi:account-group
        entities:
          - entity: person.joris
            name: Joris

      # Shopping List
      - type: shopping-list
        title: Shopping List

  - title: Media
    path: media
    icon: mdi:play-circle
    badges: []
    cards:
      # Sony TV
      - type: media-control
        entity: media_player.sony_xr_55x90k

      # Sonos - TV Room (soundbar/surround)
      - type: media-control
        entity: media_player.tv_room

      # Sonos - Dining Room
      - type: media-control
        entity: media_player.dining_room

      # Sonos - Hallway
      - type: media-control
        entity: media_player.hallway

  - title: Sonos
    path: sonos
    icon: mdi:speaker-group
    badges: []
    cards:
      # TV Room Surround System
      - type: entities
        title: TV Room Surround
        icon: mdi:surround-sound
        show_header_toggle: false
        entities:
          - entity: media_player.tv_room
            name: TV Room Speaker
          - entity: binary_sensor.tv_room_microphone
            name: Microphone
          - entity: sensor.tv_room_audio_input_format
            name: Audio Format
          - type: divider
          - entity: number.tv_room_bass
            name: Bass
          - entity: number.tv_room_treble
            name: Treble
          - entity: number.tv_room_balance
            name: Balance
          - entity: number.tv_room_sub_gain
            name: Sub Gain
          - entity: number.tv_room_surround_level
            name: Surround Level
          - entity: number.tv_room_music_surround_level
            name: Music Surround Level
          - entity: number.tv_room_audio_delay
            name: Audio Delay
          - type: divider
          - entity: switch.tv_room_surround_enabled
            name: Surround
          - entity: switch.tv_room_subwoofer_enabled
            name: Subwoofer
          - entity: switch.tv_room_night_sound
            name: Night Sound
          - entity: switch.tv_room_speech_enhancement
            name: Speech Enhancement
          - entity: switch.tv_room_surround_music_full_volume
            name: Music Full Volume
          - entity: switch.tv_room_loudness
            name: Loudness
          - entity: switch.tv_room_crossfade
            name: Crossfade

      # Dining Room Speaker
      - type: entities
        title: Dining Room
        icon: mdi:speaker
        show_header_toggle: false
        entities:
          - entity: media_player.dining_room
            name: Speaker
          - type: divider
          - entity: number.dining_room_bass
            name: Bass
          - entity: number.dining_room_treble
            name: Treble
          - entity: number.dining_room_balance
            name: Balance
          - entity: switch.dining_room_loudness
            name: Loudness
          - entity: switch.dining_room_crossfade
            name: Crossfade

      # Hallway Speaker
      - type: entities
        title: Hallway
        icon: mdi:speaker
        show_header_toggle: false
        entities:
          - entity: media_player.hallway
            name: Speaker
          - type: divider
          - entity: number.hallway_bass
            name: Bass
          - entity: number.hallway_treble
            name: Treble
          - entity: number.hallway_balance
            name: Balance
          - entity: switch.hallway_loudness
            name: Loudness
          - entity: switch.hallway_crossfade
            name: Crossfade

  - title: Printer
    path: printer
    icon: mdi:printer
    badges: []
    cards:
      - type: entities
        title: HP ENVY 5000
        icon: mdi:printer
        entities:
          - entity: sensor.hp_envy_5000_series
            name: Status
          - entity: sensor.hp_envy_5000_series_black_ink
            name: Black Ink
            icon: mdi:water
          - entity: sensor.hp_envy_5000_series_tri_color_ink
            name: Tri-Color Ink
            icon: mdi:palette

      - type: gauge
        entity: sensor.hp_envy_5000_series_black_ink
        name: Black Ink Level
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 20
          red: 5

      - type: gauge
        entity: sensor.hp_envy_5000_series_tri_color_ink
        name: Tri-Color Ink Level
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 20
          red: 5

  - title: System
    path: system
    icon: mdi:cog
    badges: []
    cards:
      - type: entities
        title: Updates
        icon: mdi:update
        entities:
          - entity: update.home_assistant_core_update
            name: HA Core
          - entity: update.home_assistant_operating_system_update
            name: HA OS
          - entity: update.home_assistant_supervisor_update
            name: HA Supervisor
          - entity: update.matter_server_update
            name: Matter Server

      - type: entities
        title: System
        entities:
          - entity: conversation.home_assistant
            name: Voice Assistant
          - entity: sensor.backup_backup_manager_state
            name: Backup Status
