# Wall-mounted phone (Samsung Galaxy Note 9, QHD+ 1440x2960 portrait) running
# Fully Kiosk Browser. Android renders it at 3.5x, so the page sees a ~412x846 CSS
# viewport; the Home view is laid out to fit 360x800 without scrolling.
# Pushed to the "wall-phone" dashboard:
#   uv run --with pyyaml --with websockets scripts/push_dashboard.py config/dashboards/wall_phone.yaml wall-phone
# Power figures are read-only; only heat pumps and lights are controllable.
title: Wall Phone
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 1
    sections:
      # Clock, then current weather and the next days.
      - type: grid
        cards:
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {% set up = is_state('sun.sun', 'above_horizon') %}
              # {{ now().strftime('%H:%M') }}
              **{{ now().strftime('%A %-d %B') }}** · {{ 'sunset' if up else 'sunrise' }} {{ as_timestamp(state_attr('sun.sun', 'next_setting' if up else 'next_rising')) | timestamp_custom('%H:%M') }}
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
            forecast_type: daily
            tap_action:
              action: none
            grid_options:
              columns: full

      # Live power, read-only. The heading opens the Power view.
      - type: grid
        cards:
          - type: heading
            heading: Power
            heading_style: subtitle
            icon: mdi:flash
            tap_action:
              action: navigate
              navigation_path: /wall-phone/power
            badges:
              - &badge
                type: entity
                entity: sensor.alphaess_daily_pv_generation
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: none
              - <<: *badge
                entity: sensor.alphaess_self_sufficiency
                icon: mdi:home-battery
                color: green
          - &power
            type: markdown
            grid_options:
              columns: 6
            content: |
              {% set w = states('sensor.alphaess_instantaneous_generation') | float(0) %}
              <ha-icon icon="mdi:solar-power-variant"></ha-icon> Solar
              ## {{ '%.2f kW' | format(w / 1000) if w | abs >= 1000 else '%d W' | format(w) }}
          - <<: *power
            content: |
              {% set w = states('sensor.alphaess_instantaneous_load') | float(0) %}
              <ha-icon icon="mdi:home-lightning-bolt"></ha-icon> Using
              ## {{ '%.2f kW' | format(w / 1000) if w | abs >= 1000 else '%d W' | format(w) }}
          - <<: *power
            content: |
              {% set w = states('sensor.alphaess_instantaneous_battery_i_o') | float(0) %}
              {% set soc = states('sensor.alphaess_instantaneous_battery_soc') | float(0) %}
              {% set lvl = ([[(soc / 10) | round(0) | int, 1] | max, 10] | min) * 10 %}
              {% set icon = ('battery-charging-' ~ lvl) if w < -20 else ('battery' if lvl == 100 else 'battery-' ~ lvl) %}
              <ha-icon icon="mdi:{{ icon }}"></ha-icon> {{ 'Charging' if w < -20 else 'Discharging' if w > 20 else 'Battery' }}
              ## {{ soc | round(0) | int }}%{{ ' · %.1f kW' | format(w | abs / 1000) if w | abs >= 100 else '' }}
          - <<: *power
            content: |
              {% set w = states('sensor.alphaess_instantaneous_grid_i_o_total') | float(0) %}
              <ha-icon icon="mdi:{{ 'transmission-tower-import' if w > 20 else 'transmission-tower-export' if w < -20 else 'transmission-tower' }}"></ha-icon> {{ 'Importing' if w > 20 else 'Exporting' if w < -20 else 'Grid' }}
              ## {{ '%.2f kW' | format(w | abs / 1000) if w | abs >= 1000 else '%d W' | format(w | abs) }}

      # Heat pumps: icon toggles on/off, -/+ sets the target, the name opens
      # the full thermostat (modes, fan, swing). Then lights and the bedroom.
      - type: grid
        cards:
          - type: heading
            heading: Home
            heading_style: subtitle
            icon: mdi:home-thermometer
            badges:
              - type: entity
                entity: sensor.living_room_measured_outdoor_air_temperature
                name: Outside
                icon: mdi:thermometer
                show_name: true
                tap_action:
                  action: none
          - &heat_pump
            type: tile
            entity: climate.living_room
            name: Living room
            state_content:
              - state
              - current_temperature
            icon_tap_action:
              action: toggle
            grid_options:
              columns: full
            features_position: inline
            features:
              - type: target-temperature
          - <<: *heat_pump
            entity: climate.dining_room
            name: Dining room
          - <<: *heat_pump
            entity: climate.hall
            name: Hall
          - type: tile
            entity: switch.lampe_salon
            name: Lampe salon
            icon: mdi:floor-lamp
            color: amber
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.cleargras_cn_blt_3_vopvdcqc4800_dk1_temperature_p_2_1
            name: Jodie's room
            icon: mdi:bed
            color: teal
            state_content:
              - state
            tap_action:
              action: none
            grid_options:
              columns: 6

  - title: Power
    path: power
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: subtitle
            icon: mdi:flash
          - type: power-sankey
            layout: vertical
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Last 24 hours
            heading_style: subtitle
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.alphaess_instantaneous_generation
                name: Solar
              - entity: sensor.alphaess_instantaneous_load
                name: Using
              - entity: sensor.alphaess_instantaneous_grid_i_o_total
                name: Grid

      - type: grid
        cards:
          - type: heading
            heading: Today
            heading_style: subtitle
            icon: mdi:calendar-today
          - &today
            type: tile
            entity: sensor.alphaess_daily_pv_generation
            name: Generated
            icon: mdi:solar-power
            color: amber
            tap_action:
              action: none
            grid_options:
              columns: 6
          - <<: *today
            entity: sensor.alphaess_total_load
            name: Consumed
            icon: mdi:home-lightning-bolt
            color: blue
          - <<: *today
            entity: sensor.alphaess_daily_feed_in
            name: Exported
            icon: mdi:transmission-tower-export
            color: purple
          - <<: *today
            entity: sensor.alphaess_daily_grid_consumption
            name: Imported
            icon: mdi:transmission-tower-import
            color: brown
