# Wall-mounted phone (Samsung Galaxy Note 9, QHD+ 1440x2960 portrait) running
# Fully Kiosk Browser. Android renders it at 3.5x, so the page sees a ~412x846 CSS
# viewport. The Home view puts clock + wind, power and the heat pumps first,
# then the car charger.
# Pushed to the "wall-phone" dashboard:
#   uv run --with pyyaml --with websockets scripts/push_dashboard.py config/dashboards/wall_phone.yaml wall-phone
# Power figures are read-only; only heat pumps, lights, the vacuum and the
# car charger's Charge now are controllable.
title: Wall Phone
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 1
    sections:
      # Clock with the next sunset (by day) or sunrise (at night) and current
      # weather, then the wind. The headline flags a wind
      # change of 90 degrees or more (e.g. northerly to southerly) and the
      # 12 h peak; the chart below shows the next 12 h.
      # Data: sensor.hourly_forecast (config/packages/wall_phone.yaml).
      - type: grid
        cards:
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set fc = state_attr('sensor.hourly_forecast', 'forecast') or [] %}
              {%- set dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'] %}
              {%- set arrows = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'] %}
              {%- set icons = {'clear-night': 'weather-night', 'cloudy': 'weather-cloudy', 'exceptional': 'alert-circle-outline', 'fog': 'weather-fog', 'hail': 'weather-hail', 'lightning': 'weather-lightning', 'lightning-rainy': 'weather-lightning-rainy', 'partlycloudy': 'weather-partly-cloudy', 'pouring': 'weather-pouring', 'rainy': 'weather-rainy', 'snowy': 'weather-snowy', 'snowy-rainy': 'weather-snowy-rainy', 'sunny': 'weather-sunny', 'windy': 'weather-windy', 'windy-variant': 'weather-windy-variant'} %}
              {%- macro sector(b) %}{{ ((b | float(0) + 22.5) // 45) | int % 8 }}{% endmacro %}
              {%- macro when(dt) %}{% set l = dt | as_datetime | as_local %}{{ l.strftime('%H:%M') if l.date() == now().date() else l.strftime('%a %H:%M') }}{% endmacro %}
              {%- set w = states.weather.forecast_home.attributes %}
              {%- set i0 = sector(w.wind_bearing) | int %}
              {%- set ns = namespace(turn=none, peak=0, peak_t=none) %}
              {%- for f in fc[:12] %}
              {%- set d = (sector(f.wind_bearing) | int - i0) % 8 %}
              {%- if ns.turn is none and 2 <= d <= 6 %}{% set ns.turn = f %}{% endif %}
              {%- if f.wind_speed | float(0) > ns.peak %}{% set ns.peak = f.wind_speed | float(0) %}{% set ns.peak_t = f.datetime %}{% endif %}
              {%- endfor %}
              {%- set up = is_state('sun.sun', 'above_horizon') %}
              ## {{ now().strftime('%H:%M') }} · {{ now().strftime('%a %-d %b') }} · <ha-icon icon="mdi:weather-sunset-{{ 'down' if up else 'up' }}"></ha-icon> {{ as_timestamp(state_attr('sun.sun', 'next_setting' if up else 'next_rising')) | timestamp_custom('%H:%M') }}
              <ha-icon icon="mdi:{{ icons.get(states('weather.forecast_home'), 'weather-cloudy') }}"></ha-icon> {{ states('weather.forecast_home') | replace('-', ' ') | replace('partlycloudy', 'partly cloudy') | capitalize }} {{ w.temperature | round(0) | int }}° · <ha-icon icon="mdi:weather-windy"></ha-icon> **{{ dirs[i0] }} {{ w.wind_speed | float(0) | round(0) | int }} km/h**
              {%- set rain = fc[:12] | map(attribute='precipitation') | map('float', 0) | sum %} · <ha-icon icon="mdi:water"></ha-icon> {{ '%.1f mm/12 h' | format(rain) if rain >= 0.1 else 'dry 12 h' }}<br>
              {%- if ns.turn %}Turning **{{ dirs[sector(ns.turn.wind_bearing) | int] }}** ~{{ when(ns.turn.datetime) }}{% else %}Steady {{ dirs[i0] }}{% endif %}
              {%- if ns.peak_t %} · peak {{ ns.peak | round(0) | int }} km/h {{ when(ns.peak_t) }}{% endif %}
          # Last 3 h (grey band, dashed: what the weather entity recorded) and
          # the next 12 h: a row of condition icons along the top every 2 h,
          # wind (blue, km/h, left axis) labelled with its direction,
          # temperature (orange, °C, right axis) and rain as a pale blue band. Needs
          # the ApexCharts card (HACS); the labels read sensor.hourly_forecast
          # in the same order as the points.
          - type: custom:apexcharts-card
            graph_span: 15h
            span:
              start: hour
              offset: -3h
            now:
              show: true
              color: '#9e9e9e'
            header:
              show: false
            grid_options:
              columns: full
            apex_config:
              chart:
                height: 200
                parentHeightOffset: 0
              legend:
                show: false
              # Units above each axis; tick labels are plain numbers.
              title:
                text: km/h
                align: left
                offsetX: 4
                style:
                  fontSize: 11px
                  fontWeight: 500
                  color: '#1e88e5'
              subtitle:
                text: °C
                align: right
                offsetX: -4
                offsetY: 0
                style:
                  fontSize: 11px
                  fontWeight: 500
                  color: '#fb8c00'
              tooltip:
                enabled: false
              grid:
                borderColor: rgba(127, 127, 127, 0.2)
                strokeDashArray: 3
                padding:
                  left: 6
                  right: 14
                  top: -14
                  bottom: -4
              xaxis:
                axisBorder:
                  show: false
                axisTicks:
                  show: false
                labels:
                  format: HH:mm
                  style:
                    colors: var(--secondary-text-color)
              fill:
                type: [gradient, solid, solid, solid, solid, solid, solid, solid, solid, solid]
                gradient:
                  shadeIntensity: 0
                  opacityFrom: 0.35
                  opacityTo: 0.02
                  stops: [0, 100]
              dataLabels:
                enabledOnSeries: [3, 4]
                background:
                  enabled: false
                offsetY: -8
                style:
                  fontSize: 12px
                  fontWeight: 600
                  colors: ['#000', '#000', '#000', '#000', '#1565c0']
                formatter: |
                  EVAL:function (val, opts) {
                    const i = opts.dataPointIndex;
                    if (i % 2 !== 0) return '';
                    const hass = document.querySelector('home-assistant').hass;
                    const f = hass.states['sensor.hourly_forecast'].attributes.forecast[i];
                    if (!f) return '';
                    if (opts.seriesIndex === 3) return {
                      'clear-night': '🌙', 'cloudy': '☁️', 'exceptional': '⚠️', 'fog': '🌫️',
                      'hail': '🌨️', 'lightning': '🌩️', 'lightning-rainy': '⛈️',
                      'partlycloudy': '⛅', 'pouring': '☔', 'rainy': '🌧️', 'snowy': '❄️',
                      'snowy-rainy': '🌨️', 'sunny': '☀️', 'windy': '🌬️', 'windy-variant': '🌬️',
                    }[f.condition] || '';
                    if (opts.seriesIndex !== 4) return '';
                    const s = Math.floor((f.wind_bearing + 22.5) / 45) % 8;
                    return ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'][s] + ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][s];
                  }
            # No min/max here: the hidden Scale series below set each axis's
            # range to four round steps (the ticks share the grid lines),
            # keeping the top ~30% clear for the icon and direction rows.
            yaxis: &forecast_yaxis
              - id: wind
                apex_config:
                  tickAmount: 4
                  labels:
                    style:
                      colors: '#1e88e5'
                    formatter: |
                      EVAL:function (v) { return Math.round(v); }
              - id: temp
                opposite: true
                apex_config:
                  tickAmount: 4
                  labels:
                    style:
                      colors: '#fb8c00'
                    formatter: |
                      EVAL:function (v) { return Math.round(v); }
              - id: rain
                show: false
                min: 0
                max: ~4
              - id: sky
                show: false
                min: 0
                max: 1
            series:
              - entity: sensor.hourly_forecast
                name: Wind
                yaxis_id: wind
                type: area
                color: '#1e88e5'
                curve: smooth
                stroke_width: 2.5
                unit: ' km/h'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.wind_speed]);
              - entity: sensor.hourly_forecast
                name: Temperature
                yaxis_id: temp
                type: line
                color: '#fb8c00'
                curve: smooth
                stroke_width: 2
                unit: ' °C'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.temperature]);
              - entity: sensor.hourly_forecast
                name: Rain
                yaxis_id: rain
                type: area
                curve: stepline
                color: '#42a5f5'
                opacity: 0.35
                stroke_width: 0
                unit: ' mm'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.precipitation]);
              - entity: sensor.hourly_forecast
                name: Sky
                yaxis_id: sky
                type: line
                color: transparent
                stroke_width: 0
                show:
                  datalabels: true
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), 0.94]);
              - entity: sensor.hourly_forecast
                name: Direction
                yaxis_id: sky
                type: line
                color: transparent
                stroke_width: 0
                show:
                  datalabels: true
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), 0.8]);
              # Observed so far (dashed), from the weather entity's history.
              - entity: weather.forecast_home
                attribute: wind_speed
                name: Wind so far
                yaxis_id: wind
                type: line
                color: '#1e88e5'
                curve: smooth
                stroke_width: 2
                stroke_dash: 4
                extend_to: now
              - entity: weather.forecast_home
                attribute: temperature
                name: Temperature so far
                yaxis_id: temp
                type: line
                color: '#fb8c00'
                curve: smooth
                stroke_width: 2
                stroke_dash: 4
                extend_to: now
              # Grey band from the chart's start to now.
              - entity: sensor.hourly_forecast
                name: Past
                yaxis_id: sky
                type: area
                color: '#9e9e9e'
                opacity: 0.12
                stroke_width: 0
                curve: stepline
                extend_to: false
                data_generator: |
                  return [[start.getTime(), 1], [new Date().getTime(), 1]];
              # Invisible: pins the wind axis to 0..4 steps of 5, 10, 15 km/h…
              # and the temperature axis to 4 steps of 1, 2, 3, 5 or 10 °C, with
              # the forecast (and the current reading) in the lower ~70%.
              - entity: sensor.hourly_forecast
                name: Wind scale
                yaxis_id: wind
                type: line
                color: transparent
                stroke_width: 0
                extend_to: false
                data_generator: |
                  const fc = entity.attributes.forecast.slice(0, 13);
                  const v = Math.max(...fc.map(f => f.wind_speed), hass.states['weather.forecast_home'].attributes.wind_speed);
                  const t = new Date(fc[0].datetime).getTime();
                  return [[t, 0], [t, 4 * Math.max(5, Math.ceil(v / 2.8 / 5) * 5)]];
              - entity: sensor.hourly_forecast
                name: Temperature scale
                yaxis_id: temp
                type: line
                color: transparent
                stroke_width: 0
                extend_to: false
                data_generator: |
                  const fc = entity.attributes.forecast.slice(0, 13);
                  const temps = fc.map(f => f.temperature).concat(hass.states['weather.forecast_home'].attributes.temperature);
                  const lo = Math.min(...temps) - 1, hi = Math.max(...temps) + 0.5;
                  const s = [1, 2, 3, 5, 10].find(s => Math.floor(lo / s) * s + 2.8 * s >= hi) || 20;
                  const m = Math.floor(lo / s) * s;
                  const t = new Date(fc[0].datetime).getTime();
                  return [[t, m], [t, m + 4 * s]];

      # Live power, read-only. The heading opens the Power view.
      - type: grid
        cards:
          - type: heading
            heading: Power
            heading_style: subtitle
            icon: mdi:flash
            tap_action:
              action: navigate
              navigation_path: /wall-phone/power
            badges:
              - &badge
                type: entity
                entity: sensor.alphaess_daily_pv_generation
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: none
              - <<: *badge
                entity: sensor.alphaess_self_sufficiency
                icon: mdi:home-battery
                color: green
              # Only while the car charges (Evnex polls its cloud every ~5 min).
              - type: entity
                entity: sensor.garage_joris_home_charger_metered_power
                icon: mdi:ev-station
                color: green
                tap_action:
                  action: none
                visibility:
                  - condition: state
                    entity: binary_sensor.garage_joris_home_charger_charging
                    state: "on"
          # Big value with the last 6 h drawn underneath (6 points an hour;
          # watts, as the entities report them; grid is negative when exporting).
          - &power
            type: sensor
            entity: sensor.alphaess_instantaneous_generation
            name: Solar
            icon: mdi:solar-power-variant
            graph: line
            hours_to_show: 6
            detail: 2
            grid_options:
              columns: 6
              rows: 2
          - <<: *power
            entity: sensor.alphaess_instantaneous_load
            name: Using
            icon: mdi:home-lightning-bolt
          # Charge level; the name and icon say whether it's charging or
          # discharging and how fast (sensor in the wall-phone package).
          - <<: *power
            entity: sensor.home_battery
            name: ~
            icon: ~
          - <<: *power
            entity: sensor.alphaess_instantaneous_grid_i_o_total
            name: Grid
            icon: mdi:transmission-tower

      # Heat pumps: icon toggles on/off, -/+ sets the target, the name opens
      # the full thermostat (modes, fan, swing). Then lights, Jodie's room
      # and the vacuum (tap for start / return to dock).
      - type: grid
        cards:
          - type: heading
            heading: Home
            heading_style: subtitle
            icon: mdi:home-thermometer
            badges:
              # Living room + Dining room heat pumps' energy today (Hall's
              # adapter doesn't report it); sensor in the wall-phone package.
              - type: entity
                entity: sensor.heat_pumps_today
                icon: mdi:heat-pump
                color: deep-orange
                tap_action:
                  action: none
              - type: entity
                entity: sensor.living_room_measured_outdoor_air_temperature
                name: Outside
                icon: mdi:thermometer
                show_name: true
                tap_action:
                  action: none
          - &heat_pump
            type: tile
            entity: climate.living_room
            name: Living room
            state_content:
              - state
              - current_temperature
            icon_tap_action:
              action: toggle
            grid_options:
              columns: full
            features_position: inline
            features:
              - type: target-temperature
          - <<: *heat_pump
            entity: climate.dining_room
            name: Dining room
          - <<: *heat_pump
            entity: climate.hall
            name: Hall
          # Lights: tap toggles, hold opens brightness / colour temperature.
          # Xiaomi lights come from the Xiaomi Home "Singapore" entry (NZ).
          # Both ceiling lights (select.ceiling_lights and its scripts in
          # config/packages/wall_phone.yaml): tap = on/off, tap the icon =
          # Night (moonlight) <-> Full. The icon shows the current mode.
          - type: tile
            entity: select.ceiling_lights
            name: Ceiling lights
            color: amber
            tap_action:
              action: perform-action
              perform_action: script.ceiling_lights_toggle
            icon_tap_action:
              action: perform-action
              perform_action: script.ceiling_lights_flip_mode
            grid_options:
              columns: 6
          - &light
            type: tile
            entity: light.yeelink_sg_270878066_bslamp2_s_2_light
            name: Bedside lamp
            icon: mdi:lamp
            color: amber
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - <<: *light
            entity: light.yeelink_sg_647181221_bslamp2_s_2_light
            name: Jodie's lamp
            icon: mdi:lamp
          - <<: *light
            entity: switch.lampe_salon
            name: Lampe salon
            icon: mdi:floor-lamp
          - type: tile
            entity: sensor.miaomiaoc_sg_blt_1_1g3gbqbot4k00_t2_temperature_p_2_1
            name: Jodie's room
            icon: mdi:bed
            color: teal
            tap_action:
              action: none
            grid_options:
              columns: 6
          - type: tile
            entity: vacuum.rockrobo_sg_64457686_v1
            name: Vacuum
            icon: mdi:robot-vacuum
            color: green
            grid_options:
              columns: 6

      # The Evnex charger: what it's doing (sensor.car_charger in the
      # wall-phone package), the energy added this session, and Charge now
      # (overrides the charger's off-peak schedule; off returns to it).
      # Evnex polls its cloud, so changes show up to ~5 minutes late.
      - type: grid
        cards:
          - type: heading
            heading: Car
            heading_style: subtitle
            icon: mdi:car-electric
            badges:
              - type: entity
                entity: sensor.evnex_residential_nz_total_power_usage_today
                icon: mdi:ev-station
                color: green
                tap_action:
                  action: none
          - type: tile
            entity: sensor.car_charger
            name: Charger
            color: green
            tap_action:
              action: none
            grid_options:
              columns: full
          - type: tile
            entity: sensor.garage_joris_home_charger_session_energy_added
            name: This session
            icon: mdi:battery-charging
            color: green
            tap_action:
              action: none
            grid_options:
              columns: 6
          - type: tile
            entity: switch.garage_joris_home_charger_charge_now
            name: Charge now
            icon: mdi:lightning-bolt
            color: green
            tap_action:
              action: toggle
            grid_options:
              columns: 6

      # Least urgent, so below the controls: the next 24 h (the same chart as
      # the one at the top, without the past, labels every 3 h from +1 h), then the
      # coming days.
      - type: grid
        cards:
          - type: heading
            heading: Forecast
            heading_style: subtitle
            icon: mdi:weather-partly-cloudy
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: hour
            header:
              show: false
            grid_options:
              columns: full
            apex_config:
              chart:
                height: 180
                parentHeightOffset: 0
              legend:
                show: false
              title:
                text: km/h
                align: left
                offsetX: 4
                style:
                  fontSize: 11px
                  fontWeight: 500
                  color: '#1e88e5'
              subtitle:
                text: °C
                align: right
                offsetX: -4
                offsetY: 0
                style:
                  fontSize: 11px
                  fontWeight: 500
                  color: '#fb8c00'
              tooltip:
                enabled: false
              grid:
                borderColor: rgba(127, 127, 127, 0.2)
                strokeDashArray: 3
                padding:
                  left: 6
                  right: 14
                  top: -14
                  bottom: -4
              xaxis:
                axisBorder:
                  show: false
                axisTicks:
                  show: false
                labels:
                  format: HH:mm
                  style:
                    colors: var(--secondary-text-color)
              fill:
                type: [gradient, solid, solid, solid, solid, solid, solid]
                gradient:
                  shadeIntensity: 0
                  opacityFrom: 0.35
                  opacityTo: 0.02
                  stops: [0, 100]
              dataLabels:
                enabledOnSeries: [3, 4]
                background:
                  enabled: false
                offsetY: -8
                style:
                  fontSize: 12px
                  fontWeight: 600
                  colors: ['#000', '#000', '#000', '#000', '#1565c0']
                formatter: |
                  EVAL:function (val, opts) {
                    const i = opts.dataPointIndex;
                    if (i % 3 !== 1) return '';
                    const hass = document.querySelector('home-assistant').hass;
                    const f = hass.states['sensor.hourly_forecast'].attributes.forecast[i];
                    if (!f) return '';
                    if (opts.seriesIndex === 3) return {
                      'clear-night': '🌙', 'cloudy': '☁️', 'exceptional': '⚠️', 'fog': '🌫️',
                      'hail': '🌨️', 'lightning': '🌩️', 'lightning-rainy': '⛈️',
                      'partlycloudy': '⛅', 'pouring': '☔', 'rainy': '🌧️', 'snowy': '❄️',
                      'snowy-rainy': '🌨️', 'sunny': '☀️', 'windy': '🌬️', 'windy-variant': '🌬️',
                    }[f.condition] || '';
                    if (opts.seriesIndex !== 4) return '';
                    const s = Math.floor((f.wind_bearing + 22.5) / 45) % 8;
                    return ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'][s] + ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][s];
                  }
            yaxis: *forecast_yaxis
            series:
              - entity: sensor.hourly_forecast
                name: Wind
                yaxis_id: wind
                type: area
                color: '#1e88e5'
                curve: smooth
                stroke_width: 2.5
                unit: ' km/h'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), f.wind_speed]);
              - entity: sensor.hourly_forecast
                name: Temperature
                yaxis_id: temp
                type: line
                color: '#fb8c00'
                curve: smooth
                stroke_width: 2
                unit: ' °C'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), f.temperature]);
              - entity: sensor.hourly_forecast
                name: Rain
                yaxis_id: rain
                type: area
                curve: stepline
                color: '#42a5f5'
                opacity: 0.35
                stroke_width: 0
                unit: ' mm'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), f.precipitation]);
              - entity: sensor.hourly_forecast
                name: Sky
                yaxis_id: sky
                type: line
                color: transparent
                stroke_width: 0
                show:
                  datalabels: true
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), 0.94]);
              - entity: sensor.hourly_forecast
                name: Direction
                yaxis_id: sky
                type: line
                color: transparent
                stroke_width: 0
                show:
                  datalabels: true
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), 0.8]);
              # Invisible: pins the wind axis to 0..4 steps of 5, 10, 15 km/h…
              # and the temperature axis to 4 steps of 1, 2, 3, 5 or 10 °C, with
              # the forecast (and the current reading) in the lower ~70%.
              - entity: sensor.hourly_forecast
                name: Wind scale
                yaxis_id: wind
                type: line
                color: transparent
                stroke_width: 0
                extend_to: false
                data_generator: |
                  const fc = entity.attributes.forecast;
                  const v = Math.max(...fc.map(f => f.wind_speed), hass.states['weather.forecast_home'].attributes.wind_speed);
                  const t = new Date(fc[0].datetime).getTime();
                  return [[t, 0], [t, 4 * Math.max(5, Math.ceil(v / 2.8 / 5) * 5)]];
              - entity: sensor.hourly_forecast
                name: Temperature scale
                yaxis_id: temp
                type: line
                color: transparent
                stroke_width: 0
                extend_to: false
                data_generator: |
                  const fc = entity.attributes.forecast;
                  const temps = fc.map(f => f.temperature).concat(hass.states['weather.forecast_home'].attributes.temperature);
                  const lo = Math.min(...temps) - 1, hi = Math.max(...temps) + 0.5;
                  const s = [1, 2, 3, 5, 10].find(s => Math.floor(lo / s) * s + 2.8 * s >= hi) || 20;
                  const m = Math.floor(lo / s) * s;
                  const t = new Date(fc[0].datetime).getTime();
                  return [[t, m], [t, m + 4 * s]];
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: false
            show_forecast: true
            forecast_type: daily
            tap_action:
              action: none
            grid_options:
              columns: full

  # The two Tapo C420 battery cameras behind their H200 hubs. Pictures are a
  # frame from each camera's latest clip (image.*_last_event, from the
  # tapo_events integration), so leaving this view open never wakes a
  # camera. Live video only runs while the camera dialog is open: the SD
  # stream (720p), since the Pi 3 has to transcode it to MJPEG. See
  # docs/tapo-cameras.md.
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          # What's happening now, or the latest clip of either camera.
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set cams = [['Front door', 'camera_front_door'], ['Garage', 'camera_garage']] %}
              {%- set ns = namespace(now=[], t=0, last='') %}
              {%- for name, id in cams %}
              {%- for kind in ['person', 'vehicle', 'motion'] %}
              {%- if is_state('binary_sensor.' ~ id ~ '_' ~ kind, 'on') and name not in ns.now | join %}
              {%- set ns.now = ns.now + [{'person': 'Person', 'vehicle': 'Vehicle', 'motion': 'Movement'}[kind] ~ ' at the ' ~ name | lower] %}
              {%- endif %}
              {%- endfor %}
              {%- set t = as_timestamp(states('image.' ~ id ~ '_last_event'), 0) %}
              {%- if t > ns.t %}{% set ns.t = t %}{% set ns.last = name ~ ', ' ~ state_attr('image.' ~ id ~ '_last_event', 'detection') %}{% endif %}
              {%- endfor %}
              {%- if ns.now %}
              ## <ha-icon icon="mdi:motion-sensor"></ha-icon> {{ ns.now | join(' · ') }}
              {%- else %}
              ## <ha-icon icon="mdi:shield-check-outline"></ha-icon> All quiet
              {%- endif %}
              {%- if ns.t %}
              Last clip: {{ ns.last }}, {{ relative_time(ns.t | as_datetime) }} ago
              {%- endif %}

      - type: grid
        cards:
          # Badges: what it sees right now (only while it lasts) and battery.
          - type: heading
            heading: Front door
            heading_style: title
            icon: mdi:door-closed
            badges:
              - &now_badge
                type: entity
                entity: binary_sensor.camera_front_door_person
                name: Person
                show_name: true
                show_state: false
                icon: mdi:walk
                color: red
                tap_action:
                  action: none
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_front_door_person
                    state: "on"
              - <<: *now_badge
                entity: binary_sensor.camera_front_door_vehicle
                name: Vehicle
                icon: mdi:car
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_front_door_vehicle
                    state: "on"
              - <<: *now_badge
                entity: binary_sensor.camera_front_door_motion
                name: Movement
                icon: mdi:motion-sensor
                color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_front_door_motion
                    state: "on"
                  - condition: state
                    entity: binary_sensor.camera_front_door_person
                    state: "off"
                  - condition: state
                    entity: binary_sensor.camera_front_door_vehicle
                    state: "off"
              - type: entity
                entity: sensor.camera_front_door_battery_2
                color: green
                tap_action:
                  action: none
          # Latest clip's frame; the play button opens live video.
          - type: picture-elements
            image_entity: image.camera_front_door_last_event
            grid_options:
              columns: full
            elements:
              - type: icon
                icon: mdi:play-circle
                title: Live
                tap_action:
                  action: more-info
                  entity: camera.camera_front_door_sd_stream_direct
                style:
                  top: 50%
                  left: 50%
                  color: white
                  opacity: "0.85"
                  --mdc-icon-size: 72px
                  filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.6))
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set img = 'image.camera_front_door_last_event' %}
              {%- set t = states(img) %}
              {%- if t not in ['unknown', 'unavailable'] %}
              **{{ state_attr(img, 'detection') | capitalize }}** · {{ as_timestamp(t) | timestamp_custom('%a %H:%M') }} · {{ relative_time(t | as_datetime) }} ago
              {%- else %}
              No clips in the last 7 days
              {%- endif %}
          - &floodlight
            type: tile
            entity: light.camera_front_door_floodlight_timed
            name: Light
            icon: mdi:light-flood-down
            color: amber
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          # The camera's clips in the Media panel (/media/tapo, 7 days).
          - &clips
            type: tile
            entity: image.camera_front_door_last_event
            name: Clips
            icon: mdi:filmstrip-box-multiple
            color: blue
            hide_state: true
            tap_action:
              action: navigate
              navigation_path: /media-browser/browser/app%2Cmedia-source%3A%2F%2Fmedia_source/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Ftapo/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Ftapo%2FCamera%20Front%20Door
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Garage
            heading_style: title
            icon: mdi:garage
            badges:
              - <<: *now_badge
                entity: binary_sensor.camera_garage_person
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_garage_person
                    state: "on"
              - <<: *now_badge
                entity: binary_sensor.camera_garage_vehicle
                name: Vehicle
                icon: mdi:car
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_garage_vehicle
                    state: "on"
              - <<: *now_badge
                entity: binary_sensor.camera_garage_motion
                name: Movement
                icon: mdi:motion-sensor
                color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_garage_motion
                    state: "on"
                  - condition: state
                    entity: binary_sensor.camera_garage_person
                    state: "off"
                  - condition: state
                    entity: binary_sensor.camera_garage_vehicle
                    state: "off"
              - type: entity
                entity: sensor.camera_garage_battery_2
                color: green
                tap_action:
                  action: none
          - type: picture-elements
            image_entity: image.camera_garage_last_event
            grid_options:
              columns: full
            elements:
              - type: icon
                icon: mdi:play-circle
                title: Live
                tap_action:
                  action: more-info
                  entity: camera.camera_garage_sd_stream_direct
                style:
                  top: 50%
                  left: 50%
                  color: white
                  opacity: "0.85"
                  --mdc-icon-size: 72px
                  filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.6))
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set img = 'image.camera_garage_last_event' %}
              {%- set t = states(img) %}
              {%- if t not in ['unknown', 'unavailable'] %}
              **{{ state_attr(img, 'detection') | capitalize }}** · {{ as_timestamp(t) | timestamp_custom('%a %H:%M') }} · {{ relative_time(t | as_datetime) }} ago
              {%- else %}
              No clips in the last 7 days
              {%- endif %}
          - <<: *floodlight
            entity: light.camera_garage_floodlight_timed
          - <<: *clips
            entity: image.camera_garage_last_event
            tap_action:
              action: navigate
              navigation_path: /media-browser/browser/app%2Cmedia-source%3A%2F%2Fmedia_source/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Ftapo/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Ftapo%2FCamera%20Garage

      # Detections since midnight-ish, newest first (both cameras).
