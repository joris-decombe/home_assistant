# Wall-mounted phone (Samsung Galaxy S20, portrait) running Fully Kiosk Browser.
# Pushed to the "wall-phone" dashboard:
#   uv run --with pyyaml --with websockets scripts/push_dashboard.py config/dashboards/wall_phone.yaml wall-phone
# Power figures are read-only; only heat pumps and lights are controllable.
title: Wall Phone
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 1
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: markdown
            grid_options:
              columns: full
            content: |
              # {{ now().strftime('%H:%M') }}
              {{ now().strftime('%A %-d %B') }} · {{ states('weather.forecast_home') | replace('-', ' ') | title }}, {{ state_attr('weather.forecast_home', 'temperature') | round(0) | int }}°C

      - type: grid
        cards:
          - type: heading
            heading: Power
            heading_style: title
            icon: mdi:flash
          - type: markdown
            grid_options:
              columns: 6
            content: |
              {% set w = states('sensor.alphaess_instantaneous_generation') | float(0) %}
              ## {{ '%.2f kW' | format(w / 1000) if w | abs >= 1000 else '%d W' | format(w) }}
              ☀️ Solar
          - type: markdown
            grid_options:
              columns: 6
            content: |
              {% set w = states('sensor.alphaess_instantaneous_load') | float(0) %}
              ## {{ '%.2f kW' | format(w / 1000) if w | abs >= 1000 else '%d W' | format(w) }}
              🏠 Using
          - type: markdown
            grid_options:
              columns: 6
            content: |
              {% set w = states('sensor.alphaess_instantaneous_battery_i_o') | float(0) %}
              {% set soc = states('sensor.alphaess_instantaneous_battery_soc') | float(0) %}
              ## {{ soc | round(0) | int }}%
              🔋 {{ 'Discharging' if w > 20 else 'Charging' if w < -20 else 'Idle' }}{{ ' · %d W' | format(w | abs) if w | abs > 20 else '' }}
          - type: markdown
            grid_options:
              columns: 6
            content: |
              {% set w = states('sensor.alphaess_instantaneous_grid_i_o_total') | float(0) %}
              ## {{ '%.2f kW' | format(w | abs / 1000) if w | abs >= 1000 else '%d W' | format(w | abs) }}
              ⚡ Grid{{ ' · importing' if w > 20 else ' · exporting' if w < -20 else '' }}
          - type: power-sankey
            layout: vertical
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Heat pumps
            heading_style: title
            icon: mdi:heat-pump
          - &heat_pump
            type: tile
            entity: climate.living_room
            name: Living room
            state_content:
              - hvac_action
              - current_temperature
            grid_options:
              columns: full
            features_position: bottom
            features:
              - type: climate-hvac-modes
                hvac_modes: [heat, cool, "off"]
              - type: target-temperature
          - <<: *heat_pump
            entity: climate.dining_room
            name: Dining room
          - <<: *heat_pump
            entity: climate.hall
            name: Hall

      - type: grid
        cards:
          - type: heading
            heading: Lights
            heading_style: title
            icon: mdi:lightbulb-group
          - type: tile
            entity: switch.lampe_salon
            name: Lampe salon
            icon: mdi:floor-lamp
            color: amber
            vertical: true
            tap_action:
              action: toggle
            grid_options:
              columns: 6
              rows: 2
