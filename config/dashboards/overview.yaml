# Main "Overview" dashboard (default, storage mode). This file is the source
# of truth; push it with:
#   scripts/push_dashboard.py config/dashboards/overview.yaml   (no url_path = Overview)
# The Home view's clock/wind headline and ApexCharts forecast are copied from
# wall_phone.yaml (chart taller here): change them there first, then copy across.
title: Smart Home Control
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |
        {%- set fc = state_attr('sensor.hourly_forecast', 'forecast') or [] %}
        {%- set dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'] %}
        {%- set arrows = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'] %}
        {%- set icons = {'clear-night': 'weather-night', 'cloudy': 'weather-cloudy', 'exceptional': 'alert-circle-outline', 'fog': 'weather-fog', 'hail': 'weather-hail', 'lightning': 'weather-lightning', 'lightning-rainy': 'weather-lightning-rainy', 'partlycloudy': 'weather-partly-cloudy', 'pouring': 'weather-pouring', 'rainy': 'weather-rainy', 'snowy': 'weather-snowy', 'snowy-rainy': 'weather-snowy-rainy', 'sunny': 'weather-sunny', 'windy': 'weather-windy', 'windy-variant': 'weather-windy-variant'} %}
        {%- macro sector(b) %}{{ ((b | float(0) + 22.5) // 45) | int % 8 }}{% endmacro %}
        {%- macro when(dt) %}{% set l = dt | as_datetime | as_local %}{{ l.strftime('%H:%M') if l.date() == now().date() else l.strftime('%a %H:%M') }}{% endmacro %}
        {%- set w = states.weather.forecast_home.attributes %}
        {%- set i0 = sector(w.wind_bearing) | int %}
        {%- set ns = namespace(turn=none, peak=0, peak_t=none) %}
        {%- for f in fc %}
        {%- set d = (sector(f.wind_bearing) | int - i0) % 8 %}
        {%- if ns.turn is none and 2 <= d <= 6 %}{% set ns.turn = f %}{% endif %}
        {%- if f.wind_speed | float(0) > ns.peak %}{% set ns.peak = f.wind_speed | float(0) %}{% set ns.peak_t = f.datetime %}{% endif %}
        {%- endfor %}
        {%- set up = is_state('sun.sun', 'above_horizon') %}
        ## {{ now().strftime('%H:%M') }} · {{ now().strftime('%a %-d %b') }} · <ha-icon icon="mdi:weather-sunset-{{ 'down' if up else 'up' }}"></ha-icon> {{ as_timestamp(state_attr('sun.sun', 'next_setting' if up else 'next_rising')) | timestamp_custom('%H:%M') }}
        <ha-icon icon="mdi:{{ icons.get(states('weather.forecast_home'), 'weather-cloudy') }}"></ha-icon> {{ states('weather.forecast_home') | replace('-', ' ') | replace('partlycloudy', 'partly cloudy') | capitalize }} {{ w.temperature | round(0) | int }}° · <ha-icon icon="mdi:weather-windy"></ha-icon> **{{ dirs[i0] }} {{ w.wind_speed | float(0) | round(0) | int }} km/h**
        {%- set rain = fc[:12] | map(attribute='precipitation') | map('float', 0) | sum %} · <ha-icon icon="mdi:water"></ha-icon> {{ '%.1f mm/12 h' | format(rain) if rain >= 0.1 else 'dry 12 h' }}<br>
        {%- if ns.turn %}Turning **{{ dirs[sector(ns.turn.wind_bearing) | int] }}** ~{{ when(ns.turn.datetime) }}{% else %}Steady {{ dirs[i0] }}{% endif %}
        {%- if ns.peak_t %} · peak {{ ns.peak | round(0) | int }} km/h {{ when(ns.peak_t) }}{% endif %}
    - type: custom:apexcharts-card
      graph_span: 30h
      span:
        start: hour
        offset: -6h
      now:
        show: true
        color: '#9e9e9e'
      header:
        show: false
      grid_options:
        columns: full
      apex_config:
        chart:
          height: 230
          parentHeightOffset: 0
        legend:
          show: false
        title:
          text: km/h
          align: left
          offsetX: 4
          style:
            fontSize: 11px
            fontWeight: 500
            color: '#1e88e5'
        subtitle:
          text: °C
          align: right
          offsetX: -4
          offsetY: 0
          style:
            fontSize: 11px
            fontWeight: 500
            color: '#fb8c00'
        tooltip:
          enabled: false
        grid:
          borderColor: rgba(127, 127, 127, 0.2)
          strokeDashArray: 3
          padding:
            left: 6
            right: 14
            top: -14
            bottom: -4
        xaxis:
          axisBorder:
            show: false
          axisTicks:
            show: false
          labels:
            format: HH:mm
            style:
              colors: var(--secondary-text-color)
        fill:
          type:
          - gradient
          - solid
          - solid
          - solid
          - solid
          - solid
          - solid
          gradient:
            shadeIntensity: 0
            opacityFrom: 0.35
            opacityTo: 0.02
            stops:
            - 0
            - 100
        dataLabels:
          enabledOnSeries:
          - 0
          - 3
          background:
            enabled: false
          offsetY: -8
          style:
            fontSize: 12px
            fontWeight: 600
            colors:
            - '#1565c0'
            - '#000'
            - '#000'
            - '#000'
          formatter: |
            EVAL:function (val, opts) {
              const i = opts.dataPointIndex;
              if (i % 3 !== 0) return '';
              const hass = document.querySelector('home-assistant').hass;
              const f = hass.states['sensor.hourly_forecast'].attributes.forecast[i];
              if (!f) return '';
              if (opts.seriesIndex === 3) return {
                'clear-night': '🌙', 'cloudy': '☁️', 'exceptional': '⚠️', 'fog': '🌫️',
                'hail': '🌨️', 'lightning': '🌩️', 'lightning-rainy': '⛈️',
                'partlycloudy': '⛅', 'pouring': '☔', 'rainy': '🌧️', 'snowy': '❄️',
                'snowy-rainy': '🌨️', 'sunny': '☀️', 'windy': '🌬️', 'windy-variant': '🌬️',
              }[f.condition] || '';
              const s = Math.floor((f.wind_bearing + 22.5) / 45) % 8;
              return ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'][s] + ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][s];
            }
      yaxis:
      - id: wind
        min: 0
        max: ~100
        apex_config:
          tickAmount: 5
          labels:
            style:
              colors: '#1e88e5'
            formatter: |
              EVAL:function (v) { return Math.round(v); }
      - id: temp
        opposite: true
        min: ~0
        max: ~25
        apex_config:
          tickAmount: 5
          labels:
            style:
              colors: '#fb8c00'
            formatter: |
              EVAL:function (v) { return Math.round(v); }
      - id: rain
        show: false
        min: 0
        max: ~4
      - id: sky
        show: false
        min: 0
        max: 1
      series:
      - entity: sensor.hourly_forecast
        name: Wind
        yaxis_id: wind
        type: area
        color: '#1e88e5'
        curve: smooth
        stroke_width: 2.5
        unit: ' km/h'
        show:
          datalabels: true
        data_generator: |
          return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), f.wind_speed]);
      - entity: sensor.hourly_forecast
        name: Temperature
        yaxis_id: temp
        type: line
        color: '#fb8c00'
        curve: smooth
        stroke_width: 2
        unit: ' °C'
        data_generator: |
          return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), f.temperature]);
      - entity: sensor.hourly_forecast
        name: Rain
        yaxis_id: rain
        type: area
        curve: stepline
        color: '#42a5f5'
        opacity: 0.35
        stroke_width: 0
        unit: ' mm'
        data_generator: |
          return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), f.precipitation]);
      - entity: sensor.hourly_forecast
        name: Sky
        yaxis_id: sky
        type: line
        color: transparent
        stroke_width: 0
        show:
          datalabels: true
        data_generator: |
          return entity.attributes.forecast.map(f => [new Date(f.datetime).getTime(), 0.94]);
      - entity: weather.forecast_home
        attribute: wind_speed
        name: Wind so far
        yaxis_id: wind
        type: line
        color: '#1e88e5'
        curve: smooth
        stroke_width: 2
        stroke_dash: 4
        extend_to: now
      - entity: weather.forecast_home
        attribute: temperature
        name: Temperature so far
        yaxis_id: temp
        type: line
        color: '#fb8c00'
        curve: smooth
        stroke_width: 2
        stroke_dash: 4
        extend_to: now
      - entity: sensor.hourly_forecast
        name: Past
        yaxis_id: sky
        type: area
        color: '#9e9e9e'
        opacity: 0.12
        stroke_width: 0
        curve: stepline
        extend_to: false
        data_generator: |
          return [[start.getTime(), 1], [new Date().getTime(), 1]];
  - type: grid
    cards:
    - type: heading
      heading: Power
      heading_style: subtitle
      icon: mdi:flash
      tap_action:
        action: navigate
        navigation_path: /lovelace/energy
