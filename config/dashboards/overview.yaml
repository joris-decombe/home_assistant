# Main "Overview" dashboard (default, storage mode). This file is the source
# of truth; push it with:
#   scripts/push_dashboard.py config/dashboards/overview.yaml   (no url_path = Overview)
# The Home view's clock/wind headline and ApexCharts forecast are copied from
# wall_phone.yaml (chart taller here): change them there first, then copy across.
title: Smart Home Control
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 2
    cards:
    # Earthquake alert: only while GeoNet's sensors measure shaking in
    # Wellington (binary_sensor.wellington_earthquake, MMI 3+ in the last hour;
    # config/packages/earthquakes.yaml), with the latest located quake.
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      visibility:
        - condition: state
          entity: binary_sensor.wellington_earthquake
          state: "on"
      content: |
        {%- set mmi = states('sensor.wellington_shaking') | int(0) %}
        {%- set words = {3: 'weak', 4: 'light', 5: 'moderate', 6: 'strong', 7: 'severe'} %}
        {%- set q = states.geo_location | selectattr('attributes.source', 'eq', 'geonetnz_quakes') | rejectattr('attributes.quality', 'eq', 'deleted') | sort(attribute='attributes.time', reverse=true) | first %}
        {%- set recent = q is defined and q and now() - (q.attributes.time | as_datetime) < timedelta(hours=1) %}
        <ha-alert alert-type="warning" title="Earthquake shaking in Wellington">
        Measured MMI {{ mmi }} ({{ words.get(mmi, 'extreme' if mmi > 7 else 'weak') }}).
        {%- if recent %} M{{ '%.1f' | format(q.attributes.magnitude) }}, {{ q.attributes.locality }}, {{ q.attributes.depth | round(0) | int }} km deep, {{ relative_time(q.attributes.time | as_datetime) }} ago.
        {%- else %} GeoNet will locate it in a few minutes.{% endif %}
        </ha-alert>
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |
        {%- set fc = state_attr('sensor.hourly_forecast', 'forecast') or [] %}
        {%- set dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'] %}
        {%- set arrows = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'] %}
        {%- set icons = {'clear-night': 'weather-night', 'cloudy': 'weather-cloudy', 'exceptional': 'alert-circle-outline', 'fog': 'weather-fog', 'hail': 'weather-hail', 'lightning': 'weather-lightning', 'lightning-rainy': 'weather-lightning-rainy', 'partlycloudy': 'weather-partly-cloudy', 'pouring': 'weather-pouring', 'rainy': 'weather-rainy', 'snowy': 'weather-snowy', 'snowy-rainy': 'weather-snowy-rainy', 'sunny': 'weather-sunny', 'windy': 'weather-windy', 'windy-variant': 'weather-windy-variant'} %}
        {%- macro sector(b) %}{{ ((b | float(0) + 22.5) // 45) | int % 8 }}{% endmacro %}
        {%- macro when(dt) %}{% set l = dt | as_datetime | as_local %}{{ l.strftime('%H:%M') if l.date() == now().date() else l.strftime('%a %H:%M') }}{% endmacro %}
        {%- set w = states.weather.forecast_home.attributes %}
        {%- set i0 = sector(w.wind_bearing) | int %}
        {%- set ns = namespace(turn=none, peak=0, peak_t=none) %}
        {%- for f in fc[:12] %}
        {%- set d = (sector(f.wind_bearing) | int - i0) % 8 %}
        {%- if ns.turn is none and 2 <= d <= 6 %}{% set ns.turn = f %}{% endif %}
        {%- if f.wind_speed | float(0) > ns.peak %}{% set ns.peak = f.wind_speed | float(0) %}{% set ns.peak_t = f.datetime %}{% endif %}
        {%- endfor %}
        {%- set up = is_state('sun.sun', 'above_horizon') %}
        ## {{ now().strftime('%H:%M') }} · {{ now().strftime('%a %-d %b') }} · <ha-icon icon="mdi:weather-sunset-{{ 'down' if up else 'up' }}"></ha-icon> {{ as_timestamp(state_attr('sun.sun', 'next_setting' if up else 'next_rising')) | timestamp_custom('%H:%M') }}
        <ha-icon icon="mdi:{{ icons.get(states('weather.forecast_home'), 'weather-cloudy') }}"></ha-icon> {{ states('weather.forecast_home') | replace('-', ' ') | replace('partlycloudy', 'partly cloudy') | capitalize }} {{ w.temperature | round(0) | int }}° · <ha-icon icon="mdi:weather-windy"></ha-icon> **{{ dirs[i0] }} {{ w.wind_speed | float(0) | round(0) | int }} km/h**
        {%- set rain = fc[:12] | map(attribute='precipitation') | map('float', 0) | sum %} · <ha-icon icon="mdi:water"></ha-icon> {{ '%.1f mm/12 h' | format(rain) if rain >= 0.1 else 'dry 12 h' }}<br>
        {%- if ns.turn %}Turning **{{ dirs[sector(ns.turn.wind_bearing) | int] }}** ~{{ when(ns.turn.datetime) }}{% else %}Steady {{ dirs[i0] }}{% endif %}
        {%- if ns.peak_t %} · peak {{ ns.peak | round(0) | int }} km/h {{ when(ns.peak_t) }}{% endif %}
    - type: custom:apexcharts-card
      graph_span: 15h
      span:
        start: hour
        offset: -3h
      now:
        show: true
        color: '#9e9e9e'
      header:
        show: false
      grid_options:
        columns: full
      apex_config:
        chart:
          height: 230
          parentHeightOffset: 0
        legend:
          show: false
        # Units above each axis; tick labels are plain numbers.
        title:
          text: km/h
          align: left
          offsetX: 4
          style:
            fontSize: 11px
            fontWeight: 500
            color: '#1e88e5'
        subtitle:
          text: °C
          align: right
          offsetX: -4
          offsetY: 0
          style:
            fontSize: 11px
            fontWeight: 500
            color: '#fb8c00'
        tooltip:
          enabled: false
        grid:
          borderColor: rgba(127, 127, 127, 0.2)
          strokeDashArray: 3
          padding:
            left: 6
            right: 14
            top: -14
            bottom: -4
        xaxis:
          axisBorder:
            show: false
          axisTicks:
            show: false
          labels:
            format: HH:mm
            style:
              colors: var(--secondary-text-color)
        fill:
          type: [gradient, solid, solid, solid, solid, solid, solid, solid, solid, solid]
          gradient:
            shadeIntensity: 0
            opacityFrom: 0.35
            opacityTo: 0.02
            stops: [0, 100]
        dataLabels:
          enabledOnSeries: [3, 4]
          background:
            enabled: false
          offsetY: -8
          style:
            fontSize: 12px
            fontWeight: 600
            colors: ['#000', '#000', '#000', '#000', '#1565c0']
          formatter: |
            EVAL:function (val, opts) {
              const i = opts.dataPointIndex;
              if (i % 2 !== 0) return '';
              const hass = document.querySelector('home-assistant').hass;
              const f = hass.states['sensor.hourly_forecast'].attributes.forecast[i];
              if (!f) return '';
              if (opts.seriesIndex === 3) return {
                'clear-night': '🌙', 'cloudy': '☁️', 'exceptional': '⚠️', 'fog': '🌫️',
                'hail': '🌨️', 'lightning': '🌩️', 'lightning-rainy': '⛈️',
                'partlycloudy': '⛅', 'pouring': '☔', 'rainy': '🌧️', 'snowy': '❄️',
                'snowy-rainy': '🌨️', 'sunny': '☀️', 'windy': '🌬️', 'windy-variant': '🌬️',
              }[f.condition] || '';
              if (opts.seriesIndex !== 4) return '';
              const s = Math.floor((f.wind_bearing + 22.5) / 45) % 8;
              return ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'][s] + ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][s];
            }
      # No min/max here: the hidden Scale series below set each axis's
      # range to four round steps (the ticks share the grid lines),
      # keeping the top ~30% clear for the icon and direction rows.
      yaxis:
        - id: wind
          apex_config:
            tickAmount: 4
            labels:
              style:
                colors: '#1e88e5'
              formatter: |
                EVAL:function (v) { return Math.round(v); }
        - id: temp
          opposite: true
          apex_config:
            tickAmount: 4
            labels:
              style:
                colors: '#fb8c00'
              formatter: |
                EVAL:function (v) { return Math.round(v); }
        - id: rain
          show: false
          min: 0
          max: ~4
        - id: sky
          show: false
          min: 0
          max: 1
      series:
      - entity: sensor.hourly_forecast
        name: Wind
        yaxis_id: wind
        type: area
        color: '#1e88e5'
        curve: smooth
        stroke_width: 2.5
        unit: ' km/h'
        extend_to: false
        data_generator: |
          return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.wind_speed]);
      - entity: sensor.hourly_forecast
        name: Temperature
        yaxis_id: temp
        type: line
        color: '#fb8c00'
        curve: smooth
        stroke_width: 2
        unit: ' °C'
        extend_to: false
        data_generator: |
          return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.temperature]);
      - entity: sensor.hourly_forecast
        name: Rain
        yaxis_id: rain
        type: area
        curve: stepline
        color: '#42a5f5'
        opacity: 0.35
        stroke_width: 0
        unit: ' mm'
        extend_to: false
        data_generator: |
          return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.precipitation]);
      - entity: sensor.hourly_forecast
        name: Sky
        yaxis_id: sky
        type: line
        color: transparent
        stroke_width: 0
        show:
          datalabels: true
        extend_to: false
        data_generator: |
          return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), 0.94]);
      - entity: sensor.hourly_forecast
        name: Direction
        yaxis_id: sky
        type: line
        color: transparent
        stroke_width: 0
        show:
          datalabels: true
        extend_to: false
        data_generator: |
          return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), 0.8]);
      # Observed so far (dashed), from the weather entity's history.
      - entity: weather.forecast_home
        attribute: wind_speed
        name: Wind so far
        yaxis_id: wind
        type: line
        color: '#1e88e5'
        curve: smooth
        stroke_width: 2
        stroke_dash: 4
        extend_to: now
      - entity: weather.forecast_home
        attribute: temperature
        name: Temperature so far
        yaxis_id: temp
        type: line
        color: '#fb8c00'
        curve: smooth
        stroke_width: 2
        stroke_dash: 4
        extend_to: now
      # Grey band from the chart's start to now.
      - entity: sensor.hourly_forecast
        name: Past
        yaxis_id: sky
        type: area
        color: '#9e9e9e'
        opacity: 0.12
        stroke_width: 0
        curve: stepline
        extend_to: false
        data_generator: |
          return [[start.getTime(), 1], [new Date().getTime(), 1]];
      # Invisible: pins the wind axis to 0..4 steps of 5, 10, 15 km/h…
      # and the temperature axis to 4 steps of 1, 2, 3, 5 or 10 °C, with
      # the forecast (and the current reading) in the lower ~70%.
      - entity: sensor.hourly_forecast
        name: Wind scale
        yaxis_id: wind
        type: line
        color: transparent
        stroke_width: 0
        extend_to: false
        data_generator: |
          const fc = entity.attributes.forecast.slice(0, 13);
          const v = Math.max(...fc.map(f => f.wind_speed), hass.states['weather.forecast_home'].attributes.wind_speed);
          const t = new Date(fc[0].datetime).getTime();
          return [[t, 0], [t, 4 * Math.max(5, Math.ceil(v / 2.8 / 5) * 5)]];
      - entity: sensor.hourly_forecast
        name: Temperature scale
        yaxis_id: temp
        type: line
        color: transparent
        stroke_width: 0
        extend_to: false
        data_generator: |
          const fc = entity.attributes.forecast.slice(0, 13);
          const temps = fc.map(f => f.temperature).concat(hass.states['weather.forecast_home'].attributes.temperature);
          const lo = Math.min(...temps) - 1, hi = Math.max(...temps) + 0.5;
          const s = [1, 2, 3, 5, 10].find(s => Math.floor(lo / s) * s + 2.8 * s >= hi) || 20;
          const m = Math.floor(lo / s) * s;
          const t = new Date(fc[0].datetime).getTime();
          return [[t, m], [t, m + 4 * s]];
  - type: grid
    cards:
    - type: heading
      heading: Power
      heading_style: subtitle
      icon: mdi:flash
      tap_action:
        action: navigate
        navigation_path: /lovelace/energy
      badges:
      - type: entity
        entity: sensor.alphaess_daily_pv_generation
        icon: mdi:solar-power
        color: amber
        tap_action: &id001
          action: none
      - type: entity
        entity: sensor.alphaess_self_sufficiency
        icon: mdi:home-battery
        color: green
        tap_action: *id001
      - type: entity
        entity: sensor.garage_joris_home_charger_metered_power
        icon: mdi:ev-station
        color: green
        tap_action:
          action: none
        visibility:
        - condition: state
          entity: binary_sensor.garage_joris_home_charger_charging
          state: 'on'
    - type: sensor
      entity: sensor.alphaess_instantaneous_generation
      name: Solar
      icon: mdi:solar-power-variant
      graph: line
      hours_to_show: 6
      detail: 2
      grid_options: &id002
        columns: 6
        rows: 2
    - type: sensor
      entity: sensor.alphaess_instantaneous_load
      name: Using
      icon: mdi:home-lightning-bolt
      graph: line
      hours_to_show: 6
      detail: 2
      grid_options: *id002
    - type: sensor
      entity: sensor.home_battery
      graph: line
      hours_to_show: 6
      detail: 2
      grid_options: *id002
    - type: sensor
      entity: sensor.alphaess_instantaneous_grid_i_o_total
      name: Grid
      icon: mdi:transmission-tower
      graph: line
      hours_to_show: 6
      detail: 2
      grid_options: *id002
  - type: grid
    cards:
    - type: heading
      heading: Heating
      heading_style: subtitle
      icon: mdi:heat-pump
      badges:
      - type: entity
        entity: sensor.heat_pumps_today
        icon: mdi:heat-pump
        color: deep-orange
        tap_action: &id003
          action: none
      - type: entity
        entity: sensor.living_room_measured_outdoor_air_temperature
        name: Outside
        icon: mdi:thermometer
        show_name: true
        tap_action: *id003
    - type: tile
      entity: climate.living_room
      name: Living room
      state_content:
      - state
      - current_temperature
      grid_options:
        columns: full
      features_position: bottom
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - heat
        - cool
        - dry
        - fan_only
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.dining_room
      name: Dining room
      state_content:
      - state
      - current_temperature
      grid_options:
        columns: full
      features_position: bottom
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - heat
        - cool
        - dry
        - fan_only
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.hall
      name: Hall
      state_content:
      - state
      - current_temperature
      grid_options:
        columns: full
      features_position: bottom
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - heat
        - cool
        - dry
        - fan_only
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.heater_jodie
      name: Jodie's heater
      state_content:
      - state
      - current_temperature
      grid_options:
        columns: full
      features_position: bottom
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - heat
        - 'off'
      - type: climate-preset-modes
        style: icons
        preset_modes:
        - comfort
        - eco
        - away
      - type: target-temperature
  - type: grid
    cards:
    - type: heading
      heading: Lights
      heading_style: subtitle
      icon: mdi:lightbulb-group
    - type: tile
      entity: select.ceiling_lights
      name: Ceiling lights
      color: amber
      tap_action:
        action: perform-action
        perform_action: script.ceiling_lights_toggle
      grid_options:
        columns: full
      features_position: inline
      features:
      - type: select-options
    - type: tile
      entity: light.yeelink_sg_270878066_bslamp2_s_2_light
      name: Bedside lamp
      icon: mdi:lamp
      color: amber
      grid_options:
        columns: 6
      features:
      - type: light-brightness
    - type: tile
      entity: light.yeelink_sg_647181221_bslamp2_s_2_light
      name: Jodie's lamp
      icon: mdi:lamp
      color: amber
      grid_options:
        columns: 6
