# Quakes: GeoNet NZ Quakes (core integration, set up in the UI) lists
# quakes within 300 km that may have been felt (MMI 3+) in the last 7 days,
# one geo_location entity each, newest first. "Deleted" quakes (GeoNet's
# false detections) are left out. The heading badge is Wellington's
# measured shaking right now (config/packages/earthquakes.yaml).
- title: Quakes
  path: quakes
  icon: mdi:pulse
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Earthquakes
      heading_style: subtitle
      icon: mdi:pulse
      badges:
        - type: entity
          entity: sensor.wellington_shaking
          name: Wellington now (MMI)
          icon: mdi:waveform
          show_name: true
          color: deep-orange
          tap_action:
            action: none
    - type: map
      geo_location_sources:
        - geonetnz_quakes
      entities:
        - zone.home
      theme_mode: auto
      aspect_ratio: "1:1"
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: This week
      heading_style: subtitle
      icon: mdi:format-list-bulleted
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |
        {%- set qs = states.geo_location | selectattr('attributes.source', 'eq', 'geonetnz_quakes') | rejectattr('attributes.quality', 'eq', 'deleted') | sort(attribute='attributes.time', reverse=true) | list %}
        {%- for q in qs[:15] %}
        **M{{ '%.1f' | format(q.attributes.magnitude) }}** · {{ q.attributes.locality }}<br>
        {{ relative_time(q.attributes.time | as_datetime) }} ago · {{ q.attributes.depth | round(0) | int }} km deep · {{ q.state | float(0) | round(0) | int }} km away
        {% else %}No felt quakes within 300 km this week.
        {%- endfor %}
