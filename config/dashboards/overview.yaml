- title: Energy
  path: energy
  icon: mdi:solar-power-variant
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Now
      heading_style: title
      icon: mdi:flash
      badges:
      - type: entity
        entity: sensor.alphaess_ems_status
        show_icon: false
        tap_action:
          action: none
    - type: markdown
      grid_options:
        columns: 6
      content: |
        {% set w = states('sensor.alphaess_instantaneous_generation') | float(0) %}
        ## {{ '%.2f kW' | format(w / 1000) if w | abs >= 1000 else '%d W' | format(w) }}
        ☀️ Solar
    - type: markdown
      grid_options:
        columns: 6
      content: |
        {% set w = states('sensor.alphaess_instantaneous_load') | float(0) %}
        ## {{ '%.2f kW' | format(w / 1000) if w | abs >= 1000 else '%d W' | format(w) }}
        🏠 Load
    - type: markdown
      grid_options:
        columns: 6
      content: |
        {% set w = states('sensor.alphaess_instantaneous_battery_i_o') | float(0) %}
        {% set soc = states('sensor.alphaess_instantaneous_battery_soc') | float(0) %}
        ## {{ '%.2f kW' | format(w | abs / 1000) if w | abs >= 1000 else '%d W' | format(w | abs) }}
