      name: Bedroom humidity
      icon: mdi:water-percent
      color: blue
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.miaomiaoc_sg_blt_1_1g3gbqbot4k00_t2_relative_humidity_p_2_2
      name: Jodie's room humidity
      icon: mdi:water-percent
      color: blue
      grid_options:
        columns: 4
  - type: grid
