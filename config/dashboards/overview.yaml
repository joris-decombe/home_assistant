      name: Bedroom
      icon: mdi:bed-king
      color: teal
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.miaomiaoc_sg_blt_1_1g3gbqbot4k00_t2_temperature_p_2_1
      name: Jodie's room
      icon: mdi:bed
      color: teal
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.living_room_measured_outdoor_air_temperature
      name: Outside
      icon: mdi:tree
      color: teal
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.cleargras_sg_blt_3_vopvdcqc4800_dk1_relative_humidity_p_2_2
