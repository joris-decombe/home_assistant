        show_name: true
        tap_action: *id003
      - type: entity
        entity: sensor.garage_joris_home_charger_connector_status
        tap_action: *id003
    - type: tile
      entity: sensor.garage_joris_home_charger_metered_power
      name: Power
      icon: mdi:flash
      color: green
      grid_options:
        columns: 6
      tap_action: *id003
