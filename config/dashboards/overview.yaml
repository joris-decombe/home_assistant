      name: Lampe salon
      icon: mdi:floor-lamp
      color: amber
      tap_action:
        action: toggle
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Rooms
      heading_style: subtitle
      icon: mdi:home-thermometer
    - type: tile
      entity: sensor.cleargras_sg_blt_3_vopvdcqc4800_dk1_temperature_p_2_1
      name: Living room
      icon: mdi:sofa
      color: teal
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.dining_room_measured_value_of_room_temperature
