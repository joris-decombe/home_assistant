  # The two Tapo C420 battery cameras behind their H200 hubs. Pictures are a
  # frame from each camera's latest clip (image.*_last_event, from the
  # tapo_events integration), so leaving this view open never wakes a
  # camera. Live video only runs while the camera dialog is open: the SD
  # stream (720p), since the Pi 3 has to transcode it to MJPEG. See
  # docs/tapo-cameras.md.
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: sections
    theme: South Coast
    # The title over the theme's panorama, with one live line.
    header:
      layout: responsive
      card:
        type: markdown
        text_only: true
        content: |
          # Cameras
          Front door and garage · batteries {{ states('sensor.camera_front_door_battery_2') }}% and {{ states('sensor.camera_garage_battery_2') }}%

          &nbsp;
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          # What's happening now, or the latest clip of either camera.
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set cams = [['Front door', 'camera_front_door'], ['Garage', 'camera_garage']] %}
              {%- set ns = namespace(now=[], t=0, last='') %}
              {%- for name, id in cams %}
              {%- for kind in ['person', 'vehicle', 'motion'] %}
              {%- if is_state('binary_sensor.' ~ id ~ '_' ~ kind, 'on') and name not in ns.now | join %}
              {%- set ns.now = ns.now + [{'person': 'Person', 'vehicle': 'Vehicle', 'motion': 'Movement'}[kind] ~ ' at the ' ~ name | lower] %}
              {%- endif %}
              {%- endfor %}
              {%- set t = as_timestamp(states('image.' ~ id ~ '_last_event'), 0) %}
              {%- if t > ns.t %}{% set ns.t = t %}{% set ns.last = name ~ ', ' ~ state_attr('image.' ~ id ~ '_last_event', 'detection') %}{% endif %}
              {%- endfor %}
              {%- if ns.now %}
              ## <ha-icon icon="mdi:motion-sensor"></ha-icon> {{ ns.now | join(' · ') }}
              {%- else %}
              ## <ha-icon icon="mdi:shield-check-outline"></ha-icon> All quiet
              {%- endif %}
              {%- if ns.t %}
              Last clip: {{ ns.last }}, {{ relative_time(ns.t | as_datetime) }} ago
              {%- endif %}
          # Detections since midnight-ish, newest first (both cameras).
          - type: heading
            heading: Last 24 hours
            heading_style: subtitle
            icon: mdi:timeline-clock-outline
          - type: logbook
            hours_to_show: 24
            grid_options:
              columns: full
            target:
              entity_id:
                - event.camera_front_door_detection
                - event.camera_garage_detection

      - type: grid
        cards:
          # Badges: what it sees right now (only while it lasts) and battery.
          - type: heading
            heading: Front door
            heading_style: title
            icon: mdi:door-closed
            badges:
              - &now_badge
                type: entity
                entity: binary_sensor.camera_front_door_person
                name: Person
                show_name: true
                show_state: false
                icon: mdi:walk
                color: red
                tap_action:
                  action: none
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_front_door_person
                    state: "on"
              - <<: *now_badge
                entity: binary_sensor.camera_front_door_vehicle
                name: Vehicle
                icon: mdi:car
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_front_door_vehicle
                    state: "on"
              - <<: *now_badge
                entity: binary_sensor.camera_front_door_motion
                name: Movement
                icon: mdi:motion-sensor
                color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_front_door_motion
                    state: "on"
                  - condition: state
                    entity: binary_sensor.camera_front_door_person
                    state: "off"
                  - condition: state
                    entity: binary_sensor.camera_front_door_vehicle
                    state: "off"
              - type: entity
                entity: sensor.camera_front_door_battery_2
                color: green
                tap_action:
                  action: none
          # Latest clip's frame; the play button opens live video.
          - type: picture-elements
            image_entity: image.camera_front_door_last_event
            grid_options:
              columns: full
            elements:
              - type: icon
                icon: mdi:play-circle
                title: Live
                tap_action:
                  action: more-info
                  entity: camera.camera_front_door_sd_stream_direct
                style:
                  top: 50%
                  left: 50%
                  color: white
                  opacity: "0.85"
                  --mdc-icon-size: 72px
                  filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.6))
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set img = 'image.camera_front_door_last_event' %}
              {%- set t = states(img) %}
              {%- if t not in ['unknown', 'unavailable'] %}
              **{{ state_attr(img, 'detection') | capitalize }}** · {{ as_timestamp(t) | timestamp_custom('%a %H:%M') }} · {{ relative_time(t | as_datetime) }} ago
              {%- else %}
              No clips in the last 7 days
              {%- endif %}
          - &floodlight
            type: tile
            entity: light.camera_front_door_floodlight_timed
            name: Light
            icon: mdi:light-flood-down
            color: amber
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          # The camera's clips in the Media panel (/media/tapo, 7 days).
          - &clips
            type: tile
            entity: image.camera_front_door_last_event
            name: Clips
            icon: mdi:filmstrip-box-multiple
            color: blue
            hide_state: true
            tap_action:
              action: navigate
              navigation_path: /media-browser/browser/app%2Cmedia-source%3A%2F%2Fmedia_source/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Ftapo/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Ftapo%2FCamera%20Front%20Door
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Garage
            heading_style: title
            icon: mdi:garage
            badges:
              - <<: *now_badge
                entity: binary_sensor.camera_garage_person
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_garage_person
                    state: "on"
              - <<: *now_badge
                entity: binary_sensor.camera_garage_vehicle
                name: Vehicle
                icon: mdi:car
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_garage_vehicle
                    state: "on"
              - <<: *now_badge
                entity: binary_sensor.camera_garage_motion
                name: Movement
                icon: mdi:motion-sensor
                color: orange
                visibility:
                  - condition: state
                    entity: binary_sensor.camera_garage_motion
                    state: "on"
                  - condition: state
                    entity: binary_sensor.camera_garage_person
                    state: "off"
                  - condition: state
                    entity: binary_sensor.camera_garage_vehicle
                    state: "off"
              - type: entity
                entity: sensor.camera_garage_battery_2
                color: green
                tap_action:
                  action: none
          - type: picture-elements
            image_entity: image.camera_garage_last_event
            grid_options:
              columns: full
            elements:
              - type: icon
                icon: mdi:play-circle
                title: Live
                tap_action:
                  action: more-info
                  entity: camera.camera_garage_sd_stream_direct
                style:
                  top: 50%
                  left: 50%
                  color: white
                  opacity: "0.85"
                  --mdc-icon-size: 72px
                  filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.6))
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set img = 'image.camera_garage_last_event' %}
              {%- set t = states(img) %}
              {%- if t not in ['unknown', 'unavailable'] %}
              **{{ state_attr(img, 'detection') | capitalize }}** · {{ as_timestamp(t) | timestamp_custom('%a %H:%M') }} · {{ relative_time(t | as_datetime) }} ago
              {%- else %}
              No clips in the last 7 days
              {%- endif %}
          - <<: *floodlight
            entity: light.camera_garage_floodlight_timed
          - <<: *clips
            entity: image.camera_garage_last_event
            tap_action:
              action: navigate
              navigation_path: /media-browser/browser/app%2Cmedia-source%3A%2F%2Fmedia_source/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Ftapo/%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Ftapo%2FCamera%20Garage

  - title: Quakes
    path: quakes
    icon: mdi:pulse
    type: sections
    theme: South Coast
    # The title over the theme's panorama, with one live line.
    header:
      layout: responsive
      card:
        type: markdown
        text_only: true
        content: |
          # Quakes
          {%- set n = states.geo_location | selectattr('attributes.source', 'eq', 'geonetnz_quakes') | rejectattr('attributes.quality', 'eq', 'deleted') | list | count %}
          {{ n }} felt quake{{ 's' if n != 1 }} within 300 km this week · Wellington shaking now: MMI {{ states('sensor.wellington_shaking') }}

          &nbsp;
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Earthquakes
            heading_style: subtitle
            icon: mdi:pulse
            badges:
              - type: entity
                entity: sensor.wellington_shaking
                name: Wellington now (MMI)
                icon: mdi:waveform
                show_name: true
                color: deep-orange
                tap_action:
                  action: none
          - type: map
            geo_location_sources:
              - geonetnz_quakes
            entities:
              - zone.home
            theme_mode: auto
            aspect_ratio: "1:1"
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: This week
            heading_style: subtitle
            icon: mdi:format-list-bulleted
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set qs = states.geo_location | selectattr('attributes.source', 'eq', 'geonetnz_quakes') | rejectattr('attributes.quality', 'eq', 'deleted') | sort(attribute='attributes.time', reverse=true) | list %}
              {%- for q in qs[:15] %}
              **M{{ '%.1f' | format(q.attributes.magnitude) }}** · {{ q.attributes.locality }}<br>
              {{ relative_time(q.attributes.time | as_datetime) }} ago · {{ q.attributes.depth | round(0) | int }} km deep · {{ q.state | float(0) | round(0) | int }} km away
              {% else %}No felt quakes within 300 km this week.
              {%- endfor %}

  # The house's plumbing: the iPad itself (config/packages/ipad.yaml), every
  # battery-powered device, backups and the Pi.
  - title: System
    path: system
    icon: mdi:cog-outline
    type: sections
    theme: South Coast
    # The title over the theme's panorama, with one live line.
    header:
      layout: responsive
      card:
        type: markdown
        text_only: true
        content: |
          # System
          {%- set n = states('sensor.low_batteries') | int(0) %}
          {{ n ~ ' low batteries' if n else 'Batteries fine' }} · last backup {{ relative_time(states('sensor.backup_last_successful_automatic_backup') | as_datetime) }} ago

          &nbsp;
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: This iPad
            heading_style: subtitle
            icon: mdi:tablet
          - &info
            type: tile
            entity: sensor.ipad_battery_level
            name: Battery
            color: green
            tap_action:
              action: none
            grid_options:
              columns: 6
          - <<: *info
            entity: sensor.ipad_battery_state
            name: Power
            icon: mdi:power-plug-battery
          - <<: *info
            entity: sensor.ipad_kiosk_brightness
            name: Brightness
            icon: mdi:brightness-6
            color: amber
          - <<: *info
            entity: sensor.ipad_kiosk_phase
            name: Screen mode
            color: indigo
          # The charging plug, once there is one (see the package).
          - <<: *info
            entity: switch.ipad_charger
            name: Charger plug
            icon: mdi:power-socket-au
            visibility:
              - condition: state
                entity: switch.ipad_charger
                state: ["on", "off"]
          - &kiosk_button
            type: tile
            entity: binary_sensor.ipad_kiosk_screensaver
            name: Screen off now
            icon: mdi:monitor-off
            color: indigo
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: notify.mobile_app_ipad
              data:
                message: kiosk_show_screensaver
            icon_tap_action:
              action: perform-action
              perform_action: notify.mobile_app_ipad
              data:
                message: kiosk_show_screensaver
            grid_options:
              columns: 6
          - <<: *kiosk_button
            name: Reload
            icon: mdi:reload
            tap_action:
              action: perform-action
              perform_action: notify.mobile_app_ipad
              data:
                message: kiosk_reload
            icon_tap_action:
              action: perform-action
              perform_action: notify.mobile_app_ipad
              data:
                message: kiosk_reload
          - type: history-graph
            hours_to_show: 48
            grid_options:
              columns: full
            entities:
              - entity: sensor.ipad_battery_level
                name: Battery

      # Every battery-powered device, lowest first, so the next one to
      # replace is at the top (under 20% in bold: those make the Home badge).
      - type: grid
        cards:
          - type: heading
            heading: Batteries
            heading_style: subtitle
            icon: mdi:battery-heart-variant
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set ns = namespace(out=[]) %}
              {%- for s in states.sensor | selectattr('attributes.device_class', 'defined') | selectattr('attributes.device_class', 'eq', 'battery') | rejectattr('entity_id', 'search', 'home_battery|alphaess|plop|wallphone|ipad|iphone') %}
              {%- set ns.out = ns.out + [{'name': device_attr(s.entity_id, 'name_by_user') or device_attr(s.entity_id, 'name') or s.name, 'level': s.state | float(-1)}] %}
              {%- endfor %}
              {%- for d in ns.out | sort(attribute='level') %}
              {%- set l = d.level %}
              {%- set icon = 'battery-off-outline' if l < 0 else 'battery-alert-variant-outline' if l < 20 else 'battery' if l >= 95 else 'battery-' ~ ((l / 10) | int * 10) %}
              {%- set text = d.name | trim ~ ' · ' ~ (l | int ~ '%' if l >= 0 else 'not reporting') %}
              <ha-icon icon="mdi:{{ icon }}"></ha-icon> {{ '**' ~ text ~ '**' if 0 <= l < 20 else text }}<br>
              {%- endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Home Assistant
            heading_style: subtitle
            icon: mdi:home-assistant
          - &system
            type: tile
            entity: sensor.backup_last_successful_automatic_backup
            name: Last backup
            icon: mdi:cloud-check-outline
            color: green
            tap_action:
              action: none
            grid_options:
              columns: 6
          - <<: *system
            entity: sensor.backup_next_scheduled_automatic_backup
            name: Next backup
            icon: mdi:cloud-clock-outline
            color: blue
          # The Pi's power supply (rpi_power): on means it saw under-voltage.
          - <<: *system
            entity: binary_sensor.raspberry_pi_power_status
            name: Pi power
            icon: mdi:raspberry-pi
            color: red
          - <<: *system
            entity: sensor.alphaess_ems_status
            name: Solar inverter
            icon: mdi:solar-panel
            color: amber
          - &ink
            type: tile
            entity: sensor.hp_envy_5000_series_black_ink
            name: Black ink
            icon: mdi:printer
            color: blue-grey
            tap_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
            features:
              - type: bar-gauge
          - <<: *ink
            entity: sensor.hp_envy_5000_series_tri_color_ink
            name: Colour ink
            icon: mdi:palette
            color: pink
