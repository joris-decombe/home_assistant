# The kitchen iPad's dashboard (iPad 9th gen, 10.2", landscape: 1080x810 CSS,
# three columns; portrait gets two). Pushed to the "ipad-home" dashboard:
#   uv run --with pyyaml --with websockets scripts/push_dashboard.py config/dashboards/ipad.yaml ipad-home mdi:tablet
# Logged in as the local-only, non-admin "iPad" user, in the companion app's
# kiosk mode (config/packages/ipad.yaml, docs/ipad.md).
#
# Home fits on one screen with no scrolling: the clock and who's home on
# top, then weather, energy and the car, heating and lights, and music for
# the dining room. Badges in the top bar only appear when something needs
# attention. The other tabs hold the detail, each under its title and one
# live line. Every view uses the South Coast theme
# (config/themes/south_coast.yaml), whose panorama sits behind those titles.
#
# The 12 h wind chart and the Solar charging, Quakes, Cameras and Kids views
# are copies of the wall phone's (config/dashboards/wall_phone.yaml): change
# them there first, then copy them across. Power figures are read-only
# (Alpha ESS controls never appear); the controls are heat pumps, Jodie's
# heater, the fan, lights, the vacuum, music, Yoto and the car's Charge now.
title: iPad
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    theme: South Coast
    max_columns: 3
    dense_section_placement: true
    # The clock, with the next sunset (by day) or sunrise (at night). The
    # empty line under it leaves the theme's sea and beach in view.
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: |
          {%- set up = is_state('sun.sun', 'above_horizon') %}
          # {{ now().strftime('%H:%M') }}
          {{ now().strftime('%A %-d %B') }} · <ha-icon icon="mdi:weather-sunset-{{ 'down' if up else 'up' }}"></ha-icon> {{ as_timestamp(state_attr('sun.sun', 'next_setting' if up else 'next_rising')) | timestamp_custom('%H:%M') }}

          &nbsp;
    # Who's home, then badges that only show while something needs a look.
    badges:
      - &person
        type: entity
        entity: person.joris
        show_name: true
        show_state: true
        tap_action:
          action: none
      - <<: *person
        entity: person.pauline
      - &alert_badge
        type: entity
        entity: binary_sensor.camera_front_door_person
        name: Someone at the door
        show_name: true
        show_state: false
        icon: mdi:doorbell-video
        color: red
        tap_action:
          action: navigate
          navigation_path: /ipad-home/cameras
        visibility:
          - condition: state
            entity: binary_sensor.camera_front_door_person
            state: "on"
      - <<: *alert_badge
        entity: binary_sensor.camera_garage_person
        name: Someone in the garage
        icon: mdi:garage-alert
        visibility:
          - condition: state
            entity: binary_sensor.camera_garage_person
            state: "on"
      - <<: *alert_badge
        entity: climate.heater_jodie
        name: Jodie's heater on
        icon: mdi:radiator
        color: deep-orange
        tap_action:
          action: more-info
        visibility:
          - condition: state
            entity: climate.heater_jodie
            state_not: "off"
      - <<: *alert_badge
        entity: vacuum.rockrobo_sg_64457686_v1
        name: Vacuum stuck
        icon: mdi:robot-vacuum-alert
        color: orange
        tap_action:
          action: more-info
        visibility:
          - condition: state
            entity: vacuum.rockrobo_sg_64457686_v1
            state: error
      - <<: *alert_badge
        entity: sensor.low_batteries
        name: Low batteries
        show_state: true
        icon: mdi:battery-alert-variant-outline
        color: amber
        tap_action:
          action: navigate
          navigation_path: /ipad-home/system
        visibility:
          - condition: numeric_state
            entity: sensor.low_batteries
            above: 0
      - <<: *alert_badge
        entity: binary_sensor.raspberry_pi_power_status
        name: Pi under-voltage
        icon: mdi:flash-alert
        color: red
        tap_action:
          action: navigate
          navigation_path: /ipad-home/system
        visibility:
          - condition: state
            entity: binary_sensor.raspberry_pi_power_status
            state: "on"
    sections:
      # Weather: now, the wind (the headline flags a turn of 90 degrees or
      # more, e.g. northerly to southerly, and the 12 h peak), the chart, and
      # the coming days. Data: sensor.hourly_forecast
      # (config/packages/wall_phone.yaml).
      - type: grid
        cards:
          # Earthquake alert: only while GeoNet's sensors measure shaking in
          # Wellington (binary_sensor.wellington_earthquake, MMI 3+ in the last hour;
          # config/packages/earthquakes.yaml), with the latest located quake.
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: binary_sensor.wellington_earthquake
                state: "on"
            content: |
              {%- set mmi = states('sensor.wellington_shaking') | int(0) %}
              {%- set words = {3: 'weak', 4: 'light', 5: 'moderate', 6: 'strong', 7: 'severe'} %}
              {%- set q = states.geo_location | selectattr('attributes.source', 'eq', 'geonetnz_quakes') | rejectattr('attributes.quality', 'eq', 'deleted') | sort(attribute='attributes.time', reverse=true) | first %}
              {%- set recent = q is defined and q and now() - (q.attributes.time | as_datetime) < timedelta(hours=1) %}
              <ha-alert alert-type="warning" title="Earthquake shaking in Wellington">
              Measured MMI {{ mmi }} ({{ words.get(mmi, 'extreme' if mmi > 7 else 'weak') }}).
              {%- if recent %} M{{ '%.1f' | format(q.attributes.magnitude) }}, {{ q.attributes.locality }}, {{ q.attributes.depth | round(0) | int }} km deep, {{ relative_time(q.attributes.time | as_datetime) }} ago.
              {%- else %} GeoNet will locate it in a few minutes.{% endif %}
              </ha-alert>
          - type: heading
            heading: Weather
            heading_style: subtitle
            icon: mdi:weather-partly-cloudy
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set fc = state_attr('sensor.hourly_forecast', 'forecast') or [] %}
              {%- set dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'] %}
              {%- set icons = {'clear-night': 'weather-night', 'cloudy': 'weather-cloudy', 'exceptional': 'alert-circle-outline', 'fog': 'weather-fog', 'hail': 'weather-hail', 'lightning': 'weather-lightning', 'lightning-rainy': 'weather-lightning-rainy', 'partlycloudy': 'weather-partly-cloudy', 'pouring': 'weather-pouring', 'rainy': 'weather-rainy', 'snowy': 'weather-snowy', 'snowy-rainy': 'weather-snowy-rainy', 'sunny': 'weather-sunny', 'windy': 'weather-windy', 'windy-variant': 'weather-windy-variant'} %}
              {%- macro sector(b) %}{{ ((b | float(0) + 22.5) // 45) | int % 8 }}{% endmacro %}
              {%- macro when(dt) %}{% set l = dt | as_datetime | as_local %}{{ l.strftime('%H:%M') if l.date() == now().date() else l.strftime('%a %H:%M') }}{% endmacro %}
              {%- set w = states.weather.forecast_home.attributes %}
              {%- set i0 = sector(w.wind_bearing) | int %}
              {%- set ns = namespace(turn=none, peak=0, peak_t=none) %}
              {%- for f in fc[:12] %}
              {%- set d = (sector(f.wind_bearing) | int - i0) % 8 %}
              {%- if ns.turn is none and 2 <= d <= 6 %}{% set ns.turn = f %}{% endif %}
              {%- if f.wind_speed | float(0) > ns.peak %}{% set ns.peak = f.wind_speed | float(0) %}{% set ns.peak_t = f.datetime %}{% endif %}
              {%- endfor %}
              {%- set rain = fc[:12] | map(attribute='precipitation') | map('float', 0) | sum %}
              ### <ha-icon icon="mdi:{{ icons.get(states('weather.forecast_home'), 'weather-cloudy') }}"></ha-icon> {{ w.temperature | round(0) | int }}° {{ states('weather.forecast_home') | replace('partlycloudy', 'partly cloudy') | replace('clear-night', 'clear') | replace('-', ' ') | capitalize }} · <ha-icon icon="mdi:weather-windy"></ha-icon> {{ dirs[i0] }} {{ w.wind_speed | float(0) | round(0) | int }} km/h
              {% if ns.turn %}Turning **{{ dirs[sector(ns.turn.wind_bearing) | int] }}** ~{{ when(ns.turn.datetime) }}{% else %}Steady {{ dirs[i0] }}{% endif %}
              {%- if ns.peak_t %} · peak **{{ ns.peak | round(0) | int }} km/h** {{ when(ns.peak_t) }}{% endif %} · {{ '%.1f mm rain' | format(rain) if rain >= 0.1 else 'dry' }} next 12 h
          # Last 3 h (grey band, dashed: what the weather entity recorded) and
          # the next 12 h: a row of condition icons along the top every 2 h,
          # wind (blue, km/h, left axis) labelled with its direction,
          # temperature (orange, °C, right axis) and rain as a pale blue band. Needs
          # the ApexCharts card (HACS); the labels read sensor.hourly_forecast
          # in the same order as the points.
          - type: custom:apexcharts-card
            graph_span: 15h
            span:
              start: hour
              offset: -3h
            now:
              show: true
              color: '#9e9e9e'
            header:
              show: false
            grid_options:
              columns: full
            apex_config:
              chart:
                height: 230
                parentHeightOffset: 0
              legend:
                show: false
              # Units above each axis; tick labels are plain numbers.
              title:
                text: km/h
                align: left
                offsetX: 4
                style:
                  fontSize: 11px
                  fontWeight: 500
                  color: '#1e88e5'
              subtitle:
                text: °C
                align: right
                offsetX: -4
                offsetY: 0
                style:
                  fontSize: 11px
                  fontWeight: 500
                  color: '#fb8c00'
              tooltip:
                enabled: false
              grid:
                borderColor: rgba(127, 127, 127, 0.2)
                strokeDashArray: 3
                padding:
                  left: 6
                  right: 14
                  top: -14
                  bottom: -4
              xaxis:
                axisBorder:
                  show: false
                axisTicks:
                  show: false
                labels:
                  format: HH:mm
                  style:
                    colors: var(--secondary-text-color)
              fill:
                type: [gradient, solid, solid, solid, solid, solid, solid, solid, solid, solid]
                gradient:
                  shadeIntensity: 0
                  opacityFrom: 0.35
                  opacityTo: 0.02
                  stops: [0, 100]
              dataLabels:
                enabledOnSeries: [3, 4]
                background:
                  enabled: false
                offsetY: -8
                style:
                  fontSize: 12px
                  fontWeight: 600
                  colors: ['#000', '#000', '#000', '#000', '#1565c0']
                formatter: |
                  EVAL:function (val, opts) {
                    const i = opts.dataPointIndex;
                    if (i % 2 !== 0) return '';
                    const hass = document.querySelector('home-assistant').hass;
                    const f = hass.states['sensor.hourly_forecast'].attributes.forecast[i];
                    if (!f) return '';
                    if (opts.seriesIndex === 3) return {
                      'clear-night': '🌙', 'cloudy': '☁️', 'exceptional': '⚠️', 'fog': '🌫️',
                      'hail': '🌨️', 'lightning': '🌩️', 'lightning-rainy': '⛈️',
                      'partlycloudy': '⛅', 'pouring': '☔', 'rainy': '🌧️', 'snowy': '❄️',
                      'snowy-rainy': '🌨️', 'sunny': '☀️', 'windy': '🌬️', 'windy-variant': '🌬️',
                    }[f.condition] || '';
                    if (opts.seriesIndex !== 4) return '';
                    const s = Math.floor((f.wind_bearing + 22.5) / 45) % 8;
                    return ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'][s] + ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][s];
                  }
            # No min/max here: the hidden Scale series below set each axis's
            # range to four round steps (the ticks share the grid lines),
            # keeping the top ~30% clear for the icon and direction rows.
            yaxis: &forecast_yaxis
              - id: wind
                apex_config:
                  tickAmount: 4
                  labels:
                    style:
                      colors: '#1e88e5'
                    formatter: |
                      EVAL:function (v) { return Math.round(v); }
              - id: temp
                opposite: true
                apex_config:
                  tickAmount: 4
                  labels:
                    style:
                      colors: '#fb8c00'
                    formatter: |
                      EVAL:function (v) { return Math.round(v); }
              - id: rain
                show: false
                min: 0
                max: ~4
              - id: sky
                show: false
                min: 0
                max: 1
            series:
              - entity: sensor.hourly_forecast
                name: Wind
                yaxis_id: wind
                type: area
                color: '#1e88e5'
                curve: smooth
                stroke_width: 2.5
                unit: ' km/h'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.wind_speed]);
              - entity: sensor.hourly_forecast
                name: Temperature
                yaxis_id: temp
                type: line
                color: '#fb8c00'
                curve: smooth
                stroke_width: 2
                unit: ' °C'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.temperature]);
              - entity: sensor.hourly_forecast
                name: Rain
                yaxis_id: rain
                type: area
                curve: stepline
                color: '#42a5f5'
                opacity: 0.35
                stroke_width: 0
                unit: ' mm'
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), f.precipitation]);
              - entity: sensor.hourly_forecast
                name: Sky
                yaxis_id: sky
                type: line
                color: transparent
                stroke_width: 0
                show:
                  datalabels: true
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), 0.94]);
              - entity: sensor.hourly_forecast
                name: Direction
                yaxis_id: sky
                type: line
                color: transparent
                stroke_width: 0
                show:
                  datalabels: true
                extend_to: false
                data_generator: |
                  return entity.attributes.forecast.slice(0, 13).map(f => [new Date(f.datetime).getTime(), 0.8]);
              # Observed so far (dashed), from the weather entity's history.
              - entity: weather.forecast_home
                attribute: wind_speed
                name: Wind so far
                yaxis_id: wind
                type: line
                color: '#1e88e5'
                curve: smooth
                stroke_width: 2
                stroke_dash: 4
                extend_to: now
              - entity: weather.forecast_home
                attribute: temperature
                name: Temperature so far
                yaxis_id: temp
                type: line
                color: '#fb8c00'
                curve: smooth
                stroke_width: 2
                stroke_dash: 4
                extend_to: now
              # Grey band from the chart's start to now.
              - entity: sensor.hourly_forecast
                name: Past
                yaxis_id: sky
                type: area
                color: '#9e9e9e'
                opacity: 0.12
                stroke_width: 0
                curve: stepline
                extend_to: false
                data_generator: |
                  return [[start.getTime(), 1], [new Date().getTime(), 1]];
              # Invisible: pins the wind axis to 0..4 steps of 5, 10, 15 km/h…
              # and the temperature axis to 4 steps of 1, 2, 3, 5 or 10 °C, with
              # the forecast (and the current reading) in the lower ~70%.
              - entity: sensor.hourly_forecast
                name: Wind scale
                yaxis_id: wind
                type: line
                color: transparent
                stroke_width: 0
                extend_to: false
                data_generator: |
                  const fc = entity.attributes.forecast.slice(0, 13);
                  const v = Math.max(...fc.map(f => f.wind_speed), hass.states['weather.forecast_home'].attributes.wind_speed);
                  const t = new Date(fc[0].datetime).getTime();
                  return [[t, 0], [t, 4 * Math.max(5, Math.ceil(v / 2.8 / 5) * 5)]];
              - entity: sensor.hourly_forecast
                name: Temperature scale
                yaxis_id: temp
                type: line
                color: transparent
                stroke_width: 0
                extend_to: false
                data_generator: |
                  const fc = entity.attributes.forecast.slice(0, 13);
                  const temps = fc.map(f => f.temperature).concat(hass.states['weather.forecast_home'].attributes.temperature);
                  const lo = Math.min(...temps) - 1, hi = Math.max(...temps) + 0.5;
                  const s = [1, 2, 3, 5, 10].find(s => Math.floor(lo / s) * s + 2.8 * s >= hi) || 20;
                  const m = Math.floor(lo / s) * s;
                  const t = new Date(fc[0].datetime).getTime();
                  return [[t, m], [t, m + 4 * s]];
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: false
            show_forecast: true
            forecast_type: daily
            tap_action:
              action: none
            grid_options:
              columns: full

      # Middle column: energy, the car and music. Each column is one
      # section, so it stacks at its own height (sections side by side
      # line up with the tallest one, which made Home scroll).
      # Live power, read-only. The heading opens the Energy view.
      - type: grid
        cards:
          - type: heading
            heading: Energy
            heading_style: subtitle
            icon: mdi:flash
            tap_action:
              action: navigate
              navigation_path: /ipad-home/energy
            badges:
              - &badge
                type: entity
                entity: sensor.alphaess_daily_pv_generation
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: none
              - <<: *badge
                entity: sensor.alphaess_self_sufficiency
                icon: mdi:home-battery
                color: green
          # Big value with the last 6 h drawn underneath (6 points an hour;
          # watts, as the entities report them; grid is negative when exporting).
          - &power
            type: sensor
            entity: sensor.alphaess_instantaneous_generation
            name: Solar
            icon: mdi:solar-power-variant
            graph: line
            hours_to_show: 6
            detail: 2
            grid_options:
              columns: 6
              rows: 2
          - <<: *power
            entity: sensor.alphaess_instantaneous_load
            name: Using
            icon: mdi:home-lightning-bolt
          # Charge level; the name and icon say whether it's charging or
          # discharging and how fast (sensor in the wall-phone package).
          - <<: *power
            entity: sensor.home_battery
            name: ~
            icon: ~
          - <<: *power
            entity: sensor.alphaess_instantaneous_grid_i_o_total
            name: Grid
            icon: mdi:transmission-tower
          # The Evnex charger: what it's doing (sensor.car_charger in the
          # wall-phone package), the energy added this session, and Charge now
          # (overrides the charger's off-peak schedule; off returns to it).
          # Evnex polls its cloud, so changes show up to ~5 minutes late.
          - type: heading
            heading: Car
            heading_style: subtitle
            icon: mdi:car-electric
            tap_action:
              action: navigate
              navigation_path: /ipad-home/solar-charging
            badges:
              - type: entity
                entity: sensor.evnex_residential_nz_total_power_usage_today
                icon: mdi:ev-station
                color: green
                tap_action:
                  action: none
              # While config/packages/car_solar_charging.yaml runs a session.
              - type: entity
                entity: input_boolean.car_solar_charging
                name: From solar
                show_name: true
                show_state: false
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: none
                visibility:
                  - condition: state
                    entity: input_boolean.car_solar_charging
                    state: "on"
          - type: tile
            entity: sensor.car_charger
            name: Charger
            color: green
            tap_action:
              action: none
            grid_options:
              columns: 6
          - type: tile
            entity: switch.garage_joris_home_charger_charge_now
            name: Charge now
            icon: mdi:lightning-bolt
            color: green
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          # Music for the kitchen: while something plays, the player of
          # whichever room group is chosen (sensor.music_speaker,
          # config/packages/music.yaml); always, the three moods of the time of
          # day, each playing the next playlist of its pool, shuffled. Rooms
          # and Spotify browsing are on the Music view (the heading opens it).
          - type: heading
            heading: Music
            heading_style: subtitle
            icon: mdi:music
            tap_action:
              action: navigate
              navigation_path: /ipad-home/music
          - &now_playing
            type: tile
            entity: media_player.dining_room
            state_content:
              - media_title
              - media_artist
            color: green
            grid_options:
              columns: full
            features_position: inline
            features:
              - type: media-player-playback
                controls:
                  - play_pause
                  - next
            visibility:
              - condition: state
                entity: sensor.music_speaker
                state: media_player.dining_room
              - condition: state
                entity: media_player.dining_room
                state: [playing, paused]
          - <<: *now_playing
            entity: media_player.tv_room
            name: Living room
            visibility:
              - condition: state
                entity: sensor.music_speaker
                state: media_player.tv_room
              - condition: state
                entity: media_player.tv_room
                state: [playing, paused]
          - <<: *now_playing
            entity: media_player.hallway
            visibility:
              - condition: state
                entity: sensor.music_speaker
                state: media_player.hallway
              - condition: state
                entity: media_player.hallway
                state: [playing, paused]
          # One volume for the whole group playing (number.music_volume moves
          # every speaker by the same amount), while something plays.
          - &music_volume
            type: tile
            entity: number.music_volume
            name: Volume
            color: green
            tap_action:
              action: none
            icon_tap_action:
              action: none
            features_position: inline
            features:
              - type: numeric-input
                style: slider
            grid_options:
              columns: full
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: media_player.dining_room
                    state: [playing, paused]
                  - condition: state
                    entity: media_player.tv_room
                    state: [playing, paused]
                  - condition: state
                    entity: media_player.hallway
                    state: [playing, paused]
          # Hold opens the mood's details: its next playlist.
          - &mood
            type: tile
            entity: sensor.music_mood_1
            color: deep-orange
            vertical: true
            hide_state: true
            tap_action: &play_mood_1
              action: perform-action
              perform_action: script.music_play_mood
              data:
                slot: 1
            icon_tap_action: *play_mood_1
            grid_options:
              columns: 4
              rows: 2
          - <<: *mood
            entity: sensor.music_mood_2
            color: teal
            tap_action: &play_mood_2
              action: perform-action
              perform_action: script.music_play_mood
              data:
                slot: 2
            icon_tap_action: *play_mood_2
          - <<: *mood
            entity: sensor.music_mood_3
            color: indigo
            tap_action: &play_mood_3
              action: perform-action
              perform_action: script.music_play_mood
              data:
                slot: 3
            icon_tap_action: *play_mood_3

      # Right column: heating, lights and the house.
      # Heat pumps and Jodie's heater: icon toggles on/off, -/+ sets the
      # target, the name opens the full thermostat (modes, fan, swing; the
      # heater's presets and power level). The heading opens Climate.
      - type: grid
        cards:
          - type: heading
            heading: Heating
            heading_style: subtitle
            icon: mdi:home-thermometer
            tap_action:
              action: navigate
              navigation_path: /ipad-home/climate
            badges:
              # Living room + Dining room heat pumps' energy today (Hall's
              # adapter doesn't report it); sensor in the wall-phone package.
              - type: entity
                entity: sensor.heat_pumps_today
                icon: mdi:heat-pump
                color: deep-orange
                tap_action:
                  action: none
          - &heat_pump
            type: tile
            entity: climate.living_room
            name: Living room
            state_content:
              - state
              - current_temperature
            icon_tap_action:
              action: toggle
            grid_options:
              columns: full
            features_position: inline
            features:
              - type: target-temperature
