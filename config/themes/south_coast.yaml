# South Coast: the iPad dashboard's theme (config/dashboards/ipad.yaml sets
# it on every view), after Wellington's south coast. Sea teal and sand, a
# pōhutukawa-red accent, and a panorama across the top of the screen,
# between the clock and the cards: Cook Strait with the Kaikōura ranges on the
# horizon, the beach and rocks, harakeke (flax) in flower and toetoe on a
# dune. By night the sea goes dark under a moon. Now and then a pod of
# dolphins leaps, a humpback blows and dives (or, rarely, breaches), and a
# pukeko struts along the beach by day, a kiwi at night: short SVG
# animations with long pauses, idle in between. It sits 64 px down the
# page, so the horizon falls just under each view's title or the clock, and
# scrolls away with the page; its sky and its foot fade into the page
# colour, so the cards sit on plain sand. Bump the ?v= after redrawing it,
# or the iPad keeps the cached picture. It follows
# the iPad's light/dark appearance (set the iPad to Automatic).
# Cards stay solid so text reads cleanly over the picture, and HA's own state
# colours are untouched, so solar is still amber and heating deep orange.
# The pictures are config/www/ipad/coast-{day,night}.svg (/config/www/ipad/
# on the Pi, served at /local/ipad/), drawn by scripts/coast_svg.py.
# Copy this to /config/themes/ on the Pi (configuration.yaml loads the folder
# with `frontend: themes: !include_dir_merge_named themes`), then call
# frontend.reload_themes.
South Coast:
  # Shared by both modes. Three 320 px columns need 1088 px with HA's default
  # 32 px gaps, one more than the iPad's 1080: 16 px gaps fit three (and save
  # height for the one-screen Home view).
  ha-view-sections-column-gap: 16px
  ha-view-sections-row-gap: 16px
  ha-card-border-radius: 18px
  ha-card-border-width: 0px
  ha-section-border-radius: 22px
  ha-tile-icon-border-radius: 14px
  ha-badge-border-radius: 18px
  ha-dialog-border-radius: 24px
  modes:
    light:
      primary-color: "#1f7a8c"
      accent-color: "#c8473a"
      primary-background-color: "#f2ede4"
      secondary-background-color: "#e7e0d3"
      lovelace-background: 'center 64px / 100% auto no-repeat url("/local/ipad/coast-day.svg?v=4"), #f2ede4'
      card-background-color: "#fffdf9"
      ha-card-background: "#fffdf9"
      ha-card-box-shadow: "0 1px 2px rgba(60, 45, 20, 0.05), 0 6px 20px rgba(60, 45, 20, 0.07)"
      primary-text-color: "#1d2a2e"
      secondary-text-color: "#5f6b6c"
      disabled-text-color: "#b2b0a8"
      divider-color: "rgba(30, 40, 40, 0.08)"
      ha-badge-background-color: "#fffdf9"
      app-header-background-color: "#f2ede4"
      app-header-text-color: "#1d2a2e"
      app-header-selection-bar-color: "#1f7a8c"
    dark:
      primary-color: "#5fb8c4"
      accent-color: "#ff8a6e"
      primary-background-color: "#0b1620"
      secondary-background-color: "#122230"
      lovelace-background: 'center 64px / 100% auto no-repeat url("/local/ipad/coast-night.svg?v=4"), #0b1620'
      card-background-color: "#13212c"
      ha-card-background: "#13212c"
      ha-card-box-shadow: "none"
      primary-text-color: "#e7eef0"
      secondary-text-color: "#8fa1a8"
      disabled-text-color: "#566770"
      divider-color: "rgba(200, 230, 240, 0.07)"
      ha-badge-background-color: "#13212c"
      app-header-background-color: "#0b1620"
      app-header-text-color: "#e7eef0"
      app-header-selection-bar-color: "#5fb8c4"
