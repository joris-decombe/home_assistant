# Sends our roof's solar, hour by hour, to https://power.dx2-66.com, the public
# page about it on the blog's domain (the Worker dx2-66-power, in the dx2-66
# repo: worker/power.js). Each hour of a finished day: what the panels made,
# grid import and export, battery charge and discharge, what the car charger
# used and how much of that came from the roof. All from the recorder's
# long-term statistics, which are kept for good. The page shows daily totals
# and an average day's solar only, never hourly house use or the day in
# progress, so it doesn't show when anyone was home or when the car was out.
#
# script.public_stats_send does the work. At 00:40 it sends yesterday and the
# 13 days before: the Worker replaces yesterday's hours and fills only hours
# it doesn't have for older days, so resending is harmless. Until yesterday
# has gone through whole (input_text.public_stats_pushed), it retries every
# hour and at each start. Run it by hand with a bigger `days` for older
# history; the Pi's statistics start on 15 October 2026.
#
# Hours Home Assistant missed: when it's down, or Alpha ESS gets stuck, the
# statistics show hours with nothing, then one hour holding all the energy
# that piled up (on 19 November 2026, 26 kWh of solar at 23:00). That energy
# is spread back over the missed hours and that one: solar, export and
# battery charge along the roof's usual day (the average for each hour), the
# rest evenly. Those hours are sent marked estimated. Hours with no catch-up
# yet (the gap is still open) aren't sent.
#
# The only credential is a push secret: 32+ random characters, in the Pi's
# secrets.yaml as
#   public_stats_push_auth: "Bearer <secret>"
# and as the Worker secret PUSH_SECRET on dx2-66-power. It reads nothing and
# reaches nothing in Home Assistant. All it can do is replace today's or
# yesterday's hours and fill missing hours of older days, as numbers in range.
#
# Copy to /config/packages/, add the secret, check the config and restart
# (the integration sensor in YAML doesn't reload). Later changes to the rest
# only need template, input_text, rest_command, script and automation reloads.

input_text:
  public_stats_pushed:
    name: Last day sent to power.dx2-66.com
    icon: mdi:cloud-check-outline
    max: 10

template:
  - sensor:
      - name: Car charging from the roof
        unique_id: public_stats_car_roof_power
        default_entity_id: sensor.car_roof_power
        icon: mdi:solar-power-variant
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.garage_joris_home_charger_metered_power')
             and has_value('sensor.alphaess_instantaneous_grid_i_o_total') }}
        # The car can't have taken more from the grid than the house imported,
        # so the rest came from the roof, directly or through the battery (it
        # only charges from the roof). The same split as scripts/roof-solar.mjs
        # in the dx2-66 repo, minute by minute instead of hour by hour. Evnex
        # lags Alpha ESS by a few minutes, which over-counts a little at the end
        # of a session and under-counts at its start.
        state: >
          {% set w = {'W': 1, 'kW': 1000} %}
          {% set c = 'sensor.garage_joris_home_charger_metered_power' %}
          {% set g = 'sensor.alphaess_instantaneous_grid_i_o_total' %}
          {% set car = states(c) | float(0) * w.get(state_attr(c, 'unit_of_measurement'), 1) %}
          {% set imported = [states(g) | float(0) * w.get(state_attr(g, 'unit_of_measurement'), 1), 0] | max %}
          {{ [car - imported, 0] | max | round(0) }}

sensor:
  # Its hourly statistics are the car-from-roof the script sends, where it has
  # them; elsewhere the script splits the charger's hour against grid import.
  - platform: integration
    source: sensor.car_roof_power
    name: Car energy from the roof
    unique_id: public_stats_car_roof_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
    # Keeps integrating while the power holds steady (or stays at 0).
    max_sub_interval:
      minutes: 5

rest_command:
  # One day's hours from the script, in its compact form ({unix hour start:
  # [solar, import, export, charge, discharge, car, car from roof, estimated]}),
  # spelled out as the Worker wants them.
  public_stats_send:
    url: https://power.dx2-66.com/push
    method: post
    headers:
      authorization: !secret public_stats_push_auth
    content_type: application/json
    timeout: 30
    payload: >
      {% set names = ['solar_kwh', 'import_kwh', 'export_kwh', 'battery_charge_kwh', 'battery_discharge_kwh', 'car_kwh', 'car_roof_kwh'] %}
      {% set ns = namespace(hours={}) %}
      {% for t, v in day_hours.hours.items() %}
        {% set ns.hours = dict(ns.hours, **{(t | int) | timestamp_custom('%Y-%m-%dT%H:00:00Z', false): dict(zip(names, v[:7]), estimated=(v[7] == 1))}) %}
      {% endfor %}
      {{ {'day': day_hours.day, 'hours': ns.hours} | to_json }}

automation:
  - id: public_stats_send
    alias: Send the solar hours to power.dx2-66.com
    description: Sends yesterday's hours and fills missed hours of the 13 days before.
    mode: single
    triggers:
      # Yesterday's last hour is in the statistics by about 00:12.
      - trigger: time
        at: "00:40:00"
    actions:
      - action: script.public_stats_send
        data:
          days: 14

  - id: public_stats_send_retry
    alias: Retry the solar hours for power.dx2-66.com
    description: Sends yesterday again, every hour and at start, until it has gone through whole.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: 47
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >
          {{ now().hour >= 1
             and states('input_text.public_stats_pushed') != (now() - timedelta(days=1)).date() | string }}
    actions:
      - action: script.public_stats_send
        data:
          days: 1

script:
  public_stats_send:
    alias: Send solar hours to power.dx2-66.com
    description: Sends finished days hour by hour from the long-term statistics. Yesterday's hours replace what's there; older days only gain hours they don't have.
    icon: mdi:solar-power-variant
    mode: queued
    max: 3
    fields:
      days:
        name: Days
        description: How many finished days to send, ending yesterday.
        default: 1
        selector:
          number:
            min: 1
            max: 60
            mode: box
    sequence:
      - variables:
          back: "{{ [[days | default(1) | int(1), 1] | max, 60] | min }}"
          first_day: "{{ (now() - timedelta(days=back)).date() | string }}"
          last_day: "{{ (now() - timedelta(days=1)).date() | string }}"
          # Four days earlier than the first day sent, so a gap that started
          # before it can still be spread. Local midnight (replace keeps the
          # time zone, so DST is right) to the second before today: the
          # recorder also returns a period that starts exactly at end_time.
          start: "{{ (today_at('12:00') - timedelta(days=back + 4)).replace(hour=0).isoformat() }}"
          end: "{{ (today_at('00:00') - timedelta(seconds=1)).isoformat() }}"
          # The Energy dashboard's statistics, and the car-from-roof sensor.
          ids:
            solar: sensor.alphaess_solar_production
            grid_in: sensor.alphaess_grid_to_load
            grid_out: sensor.alphaess_solar_to_grid
            charge: sensor.alphaess_charge
            discharge: sensor.alphaess_discharge
            car: sensor.garage_joris_home_charger_energy_meter
            roof: sensor.car_energy_from_the_roof
      - action: recorder.get_statistics
        data:
          statistic_ids: "{{ ids.values() | list }}"
          start_time: "{{ start }}"
          end_time: "{{ end }}"
          period: hour
          types: [change]
          units:
            energy: kWh
        response_variable: hourly
      - variables:
          # One payload per day: {day, hours: {"<UTC hour>Z": {...}}}.
          # Every tag trims the whitespace before it (`{%-`): untrimmed, the loops'
          # indentation alone overruns HA's 256 KB template output over 40 days.
          payloads: >
            {%- set s = hourly.statistics %}
            {%- set ALPHA = ['solar', 'grid_in', 'grid_out', 'charge', 'discharge'] %}
            {%- set SUNNY = ['solar', 'grid_out', 'charge'] %}
            {#- Each statistic as {hour start (unix seconds): kWh}. #}
            {%- set m = namespace(maps={}) %}
            {%- for f in ALPHA + ['car', 'roof'] %}
              {%- set rows = s.get(ids[f], []) %}
              {%- set m.maps = dict(m.maps, **{f: dict(zip(rows | map(attribute='start') | map('as_timestamp') | map('int') | list, rows | map(attribute='change') | list))}) %}
            {%- endfor %}
            {#- Every hour of the span. Alpha ESS is live in an hour when the house drew something from somewhere: it always does. #}
            {%- set t0 = as_timestamp(start) | int %}
            {%- set n = ((as_timestamp(end) | int) + 1 - t0) // 3600 %}
            {%- set T = namespace(hours=[], live=[], car=[]) %}
            {%- for i in range(n) %}
              {%- set t = t0 + i * 3600 %}
              {%- set a = namespace(ok=true) %}
              {%- for f in ALPHA %}{%- if m.maps[f].get(t) is none %}{%- set a.ok = false %}{%- endif %}{%- endfor %}
              {%- set T.hours = T.hours + [t] %}
              {%- set T.live = T.live + [a.ok and (m.maps.solar[t] > 0 or m.maps.grid_in[t] > 0 or m.maps.discharge[t] > 0)] %}
              {%- set T.car = T.car + [m.maps.car.get(t) is not none] %}
            {%- endfor %}
            {#- For each hour, the live hour that holds its energy: itself, or the catch-up after its gap. #}
            {%- set C = namespace(a=[], c=[], na=none, nc=none) %}
            {%- for i in range(n - 1, -1, -1) %}
              {%- if T.live[i] %}{%- set C.na = i %}{%- endif %}
              {%- if T.car[i] %}{%- set C.nc = i %}{%- endif %}
              {%- set C.a = [C.na] + C.a %}
              {%- set C.c = [C.nc] + C.c %}
            {%- endfor %}
            {#- The roof's usual day: average solar for each local hour, from ordinary live hours. #}
            {%- set P = namespace(rows=[]) %}
            {%- for i in range(n) %}
              {%- if T.live[i] and (i == 0 or T.live[i - 1]) %}
                {%- set P.rows = P.rows + [{'h': T.hours[i] | timestamp_custom('%H') | int, 'v': m.maps.solar[T.hours[i]]}] %}
              {%- endif %}
            {%- endfor %}
            {%- set prof = namespace(d={}) %}
            {%- for g in P.rows | groupby('h') %}
              {%- set prof.d = dict(prof.d, **{g.grouper | string: (g.list | map(attribute='v') | sum) / (g.list | count)}) %}
            {%- endfor %}
            {#- Each catch-up's group: how many hours share it, and their solar weights. #}
            {%- set G = namespace(a=[], c=[]) %}
            {%- for i in range(n) %}
              {%- if C.a[i] is not none %}{%- set G.a = G.a + [{'k': C.a[i], 'w': prof.d.get(T.hours[i] | timestamp_custom('%H') | int | string, 0)}] %}{%- endif %}
              {%- if C.c[i] is not none %}{%- set G.c = G.c + [{'k': C.c[i]}] %}{%- endif %}
            {%- endfor %}
            {%- set W = namespace(sun={}, cnt={}, car={}) %}
            {%- for g in G.a | groupby('k') %}
              {%- set W.sun = dict(W.sun, **{g.grouper | string: g.list | map(attribute='w') | sum}) %}
              {%- set W.cnt = dict(W.cnt, **{g.grouper | string: g.list | count}) %}
            {%- endfor %}
            {%- for g in G.c | groupby('k') %}{%- set W.car = dict(W.car, **{g.grouper | string: g.list | count}) %}{%- endfor %}
            {#- Each hour of the days sent: its share of its group's energy. #}
            {%- set O = namespace(rows=[]) %}
            {%- for i in range(n) %}
              {%- set t = T.hours[i] %}
              {%- set day = t | timestamp_custom('%Y-%m-%d') %}
              {%- set ca = C.a[i] %}
              {%- set cc = C.c[i] %}
              {%- if first_day <= day <= last_day and ca is not none and cc is not none %}
                {%- set k = ca | string %}
                {%- set kc = cc | string %}
                {%- set tc = T.hours[ca] %}
                {#- A real catch-up holds at least half the house's base load for every hour it covers, and 30% of the solar an average day would make in them. If not (the start of the statistics, a meter reset, Alpha ESS not counting while stuck), the gap stays empty for the page to estimate, and the catch-up is an ordinary hour. #}
                {%- set spread = W.cnt[k] > 1
                    and m.maps.solar[tc] + m.maps.grid_in[tc] + m.maps.discharge[tc] >= 0.15 * W.cnt[k]
                    and m.maps.solar[tc] >= 0.3 * W.sun[k] %}
                {%- if spread or i == ca %}
                {%- set flat = (1 / W.cnt[k]) if spread else 1 %}
                {%- set w = prof.d.get(t | timestamp_custom('%H') | int | string, 0) %}
                {%- set sunny = (((w / W.sun[k]) if W.sun[k] > 0 else flat) if spread else 1) %}
                {%- set v = namespace(d={}) %}
                {%- for f in ALPHA %}{%- set v.d = dict(v.d, **{f: m.maps[f][tc] * (sunny if f in SUNNY else flat)}) %}{%- endfor %}
                {%- set car = m.maps.car[T.hours[cc]] / W.car[kc] %}
                {%- set est = spread or W.car[kc] > 1 %}
                {%- set split = car - [car, v.d.grid_in] | min %}
                {%- set roof = m.maps.roof.get(t) if not est and m.maps.roof.get(t) is not none else split %}
                {%- set roof = [[roof, 0] | max, car] | min %}
                {%- set vals = [v.d.solar, v.d.grid_in, v.d.grid_out, v.d.charge, v.d.discharge, car] %}
                {#- Float noise can leave -0.000000001; a meter reset is far below -0.05. #}
                {%- if vals | min >= -0.05 and v.d.solar <= 6 and v.d.grid_in <= 25 and v.d.grid_out <= 6 and v.d.charge <= 6 and v.d.discharge <= 6 and car <= 8 %}
                  {#- Compact, so 60 days stay under HA's 256 KB template output: the hour's start (unix seconds) and its numbers in a fixed order. #}
                  {%- set O.rows = O.rows + [{'day': day, 'key': t, 'v': [
                    [v.d.solar, 0] | max | round(3),
                    [v.d.grid_in, 0] | max | round(3),
                    [v.d.grid_out, 0] | max | round(3),
                    [v.d.charge, 0] | max | round(3),
                    [v.d.discharge, 0] | max | round(3),
                    [car, 0] | max | round(3),
                    roof | round(3),
                    1 if est else 0,
                  ]}] %}
                {%- endif %}
                {%- endif %}
              {%- endif %}
            {%- endfor %}
            {%- set D = namespace(out=[]) %}
            {%- for g in O.rows | groupby('day') %}
              {%- set D.out = D.out + [{'day': g.grouper, 'hours': dict(zip(g.list | map(attribute='key') | list, g.list | map(attribute='v') | list))}] %}
            {%- endfor %}
            {{- D.out }}
          taken: 0
          yesterday_whole: false
      - repeat:
          for_each: "{{ payloads }}"
          sequence:
            - variables:
                response: null
            - action: rest_command.public_stats_send
              data:
                day_hours: "{{ repeat.item }}"
              response_variable: response
              continue_on_error: true
            - variables:
                ok: "{{ response is mapping and response.status == 204 }}"
                taken: "{{ taken + (1 if ok else 0) }}"
                yesterday_whole: "{{ yesterday_whole or (ok and repeat.item.day == last_day and repeat.item.hours | count >= 23) }}"
      - if:
          - condition: template
            value_template: "{{ yesterday_whole }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.public_stats_pushed
            data:
              value: "{{ last_day }}"
      - action: logbook.log
        data:
          name: power.dx2-66.com
          message: "sent {{ payloads | count }} days hour by hour, {{ taken }} took new hours"
          entity_id: script.public_stats_send
