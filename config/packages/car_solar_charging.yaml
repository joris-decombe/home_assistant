# Charges the car from solar, the car first and the home battery after. When
# the battery is 15 points above how low it can go (or 98%+ late in the day)
# and there is still a surplus, it turns on the Evnex charger's Charge now
# switch, which overrides the charger's off-peak schedule. The car (about
# 3.5 kW) then draws more than the panels make, so the battery covers the
# rest. That's fine while there's enough sun left to fill it again before the
# panels drop below the house's use (around 18:00 in spring), when it would
# start exporting otherwise: sensor.car_charging_battery_floor is how low it
# can go for that. Charge now goes back off, handing back to the charger's
# schedule, when the battery reaches that floor, when the house has been
# importing over 1 kW for 5 minutes, or when Alpha ESS stops reporting.
#
# Starting at 98% instead already caught nearly all the export; starting at
# the floor charges the car earlier, but a battery that doesn't refill comes
# back as evening import (about 0.7 kWh a day in late October 2026). That's
# the trade chosen.
#
# The solar estimate is a curve between sunrise and sunset, sin(πx)^1.5 with
# a 4 kW peak, fitted to the panels' afternoons in October 2026, scaled by
# met.no's hourly condition (sensor.hourly_forecast). The factors are what
# the panels made under each condition in the week to 3 November 2026
# (partly cloudy ~0.9 of the curve, cloudy and rainy ~0.55), shaded down a
# little. The floor counts only the sun above an assumed 1 kW house load;
# mornings come out high, but the floor bottoms out at 30% then anyway.
# Aiming for a full battery at sunset instead (counting the evening's use too)
# stopped the car too early and exported the sun that refilled the battery
# after.
#
# Signs: Alpha ESS grid I/O is positive when importing, battery I/O positive
# when discharging, so the surplus (solar minus load) is -(grid + battery).
# Both clouds poll, so the readings lag by a minute (Alpha ESS) to ~5 (Evnex).
#
# It only stops charging it started itself: a Charge now turned on by hand is
# left alone. Copy to /config/packages/ and reload automations and input
# booleans.

input_boolean:
  car_solar_charging:
    name: Car charging from solar
    icon: mdi:solar-power-variant

template:
  - binary_sensor:
      - name: Solar surplus
        unique_id: car_solar_charging_surplus
        default_entity_id: binary_sensor.solar_surplus
        icon: mdi:solar-power
        availability: >
          {{ has_value('sensor.alphaess_instantaneous_battery_soc')
             and has_value('sensor.alphaess_instantaneous_grid_i_o_total')
             and has_value('sensor.alphaess_instantaneous_battery_i_o') }}
        # The battery 15 points above its floor, so a session lasts (it
        # drains 1–2 kW while the car charges), and 98% at most.
        state: >
          {% set surplus = -(states('sensor.alphaess_instantaneous_grid_i_o_total') | float
                             + states('sensor.alphaess_instantaneous_battery_i_o') | float) %}
          {% set start = [states('sensor.car_charging_battery_floor') | float(100) + 15, 98] | min %}
          {{ states('sensor.alphaess_instantaneous_battery_soc') | float >= start and surplus > 500 }}

  - sensor:
      - name: Solar left today
        unique_id: car_solar_charging_solar_left
        default_entity_id: sensor.solar_left_today
        icon: mdi:solar-power-variant-outline
        unit_of_measurement: kWh
        state: >
          {% set peak = 4.0 %}
          {% set factor = {'sunny': 1, 'windy': 1, 'partlycloudy': 0.85, 'windy-variant': 0.85,
                           'cloudy': 0.5, 'fog': 0.4, 'rainy': 0.4, 'lightning': 0.4,
                           'pouring': 0.25, 'lightning-rainy': 0.25, 'hail': 0.25,
                           'snowy': 0.25, 'snowy-rainy': 0.25} %}
          {% set t = as_timestamp(now()) %}
          {% set dusk = as_timestamp(state_attr('sun.sun', 'next_setting')) %}
          {% set rise = as_timestamp(state_attr('sun.sun', 'next_rising')) %}
          {% set rise = rise - 86400 if rise > dusk else rise %}
          {% set ns = namespace(kwh=0) %}
          {% if is_state('sun.sun', 'above_horizon') %}
            {% for f in state_attr('sensor.hourly_forecast', 'forecast') or [] %}
              {% set start = as_timestamp(f.datetime) %}
              {# The forecast starts at the next hour: the first entry covers from now. #}
              {% set a = t if loop.first else [start, t] | max %}
              {% set b = [start + 3600, dusk] | min %}
              {% if b > a %}
                {% set x = ((a + b) / 2 - rise) / (dusk - rise) %}
                {# At sunset next_setting moves to tomorrow minutes before sun.sun turns below_horizon, so x can go below 0 (and a negative sine to the 1.5 is complex). #}
                {% set s = (pi * x) | sin if 0 < x < 1 else 0 %}
                {% set ns.kwh = ns.kwh + peak * s ** 1.5
                                * factor.get(f.condition, 0.5) * (b - a) / 3600 %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.kwh | round(1) }}

      - name: Car charging battery floor
        unique_id: car_solar_charging_floor
        default_entity_id: sensor.car_charging_battery_floor
        icon: mdi:battery-arrow-down-outline
        unit_of_measurement: "%"
        availability: "{{ has_value('sensor.solar_left_today') }}"
        # Solar left today's curve again, hour by hour, keeping only what
        # tops the house's use: the battery can't refill once the sun drops
        # below the house, so the evening's use doesn't count against it.
        state: >
          {% set house = 1.0 %}
          {% set peak = 4.0 %}
          {% set factor = {'sunny': 1, 'windy': 1, 'partlycloudy': 0.85, 'windy-variant': 0.85,
                           'cloudy': 0.5, 'fog': 0.4, 'rainy': 0.4, 'lightning': 0.4,
                           'pouring': 0.25, 'lightning-rainy': 0.25, 'hail': 0.25,
                           'snowy': 0.25, 'snowy-rainy': 0.25} %}
          {% set t = as_timestamp(now()) %}
          {% set dusk = as_timestamp(state_attr('sun.sun', 'next_setting')) %}
          {% set rise = as_timestamp(state_attr('sun.sun', 'next_rising')) %}
          {% set rise = rise - 86400 if rise > dusk else rise %}
          {% set ns = namespace(spare=0) %}
          {% if is_state('sun.sun', 'above_horizon') %}
            {% for f in state_attr('sensor.hourly_forecast', 'forecast') or [] %}
              {% set start = as_timestamp(f.datetime) %}
              {% set a = t if loop.first else [start, t] | max %}
              {% set b = [start + 3600, dusk] | min %}
              {% if b > a %}
                {% set x = ((a + b) / 2 - rise) / (dusk - rise) %}
                {% set s = (pi * x) | sin if 0 < x < 1 else 0 %}
                {% set kw = peak * s ** 1.5 * factor.get(f.condition, 0.5) %}
                {% set ns.spare = ns.spare + [kw - house, 0] | max * (b - a) / 3600 %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% set capacity = states('sensor.alphaess_installed_capacity') | float(9.6) %}
          {{ ([100 - ns.spare / capacity * 100, 30] | max, 100) | min | round(0) }}

automation:
  - id: car_solar_charging_start
    alias: Charge the car from solar
    description: Turns on Charge now when there's solar to spare and the home battery is well above its floor.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.solar_surplus
        to: "on"
        for:
          minutes: 5
      # A car plugged in while the surplus is already there.
      - trigger: state
        entity_id: binary_sensor.garage_joris_home_charger_plugged_in
        to: "on"
        for:
          minutes: 2
    conditions:
      - condition: state
        entity_id: binary_sensor.solar_surplus
        state: "on"
      # Late in the day there's no sun left to refill the battery after.
      - condition: numeric_state
        entity_id: sensor.car_charging_battery_floor
        below: 95
      - condition: state
        entity_id: binary_sensor.garage_joris_home_charger_plugged_in
        state: "on"
      - condition: state
        entity_id: sensor.garage_joris_home_charger_charger_network_status
        state: online
      # Already charging (by hand or on its schedule): nothing to do.
      - condition: state
        entity_id: switch.garage_joris_home_charger_charge_now
        state: "off"
      - condition: state
        entity_id: binary_sensor.garage_joris_home_charger_charging
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.garage_joris_home_charger_charge_now
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.car_solar_charging

  - id: car_solar_charging_stop
    alias: Stop charging the car from solar
    description: Turns Charge now back off at the battery floor, or when the grid starts charging the car.
    mode: single
    triggers:
      # The floor rises through the afternoon, so this also fires as the sun runs out.
      - trigger: template
        value_template: >
          {{ states('sensor.alphaess_instantaneous_battery_soc') | float(100)
             < states('sensor.car_charging_battery_floor') | float(0) }}
      - trigger: numeric_state
        entity_id: sensor.alphaess_instantaneous_grid_i_o_total
        above: 1000
        for:
          minutes: 5
      # Its cloud can get stuck (see alpha_ess.yaml); don't charge blind.
      - trigger: state
        entity_id: sensor.alphaess_instantaneous_battery_soc
        to:
          - unavailable
          - unknown
        for:
          minutes: 10
    conditions:
      - condition: state
        entity_id: input_boolean.car_solar_charging
        state: "on"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.garage_joris_home_charger_charge_now
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.car_solar_charging

  # Unplugged, or Charge now turned off some other way: the solar session is over.
  - id: car_solar_charging_clear
    alias: Clear car solar charging
    description: Clears the solar-charging flag when the car is unplugged or Charge now goes off.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.garage_joris_home_charger_plugged_in
        to: "off"
      - trigger: state
        entity_id: switch.garage_joris_home_charger_charge_now
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.car_solar_charging
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.car_solar_charging
