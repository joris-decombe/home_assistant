# Jodie's Yoto series for the wall phone's Kids view: one select per series
# of Yoto Club cards in her library. Picking a card plays it on her player.
# The state stays unknown so the same card can be picked again. Card IDs come
# from the player's media browser (yoto://card/<id>). Copy to /config/packages/
# and reload template entities.

template:
  - select:
      - name: Yoto 5-Minute Stories
        unique_id: yoto_5_minute_stories
        icon: mdi:timer-sand
        state: "{{ none }}"
        options: >
          {{ ['Dinosaur', 'Enchanted', 'Outer Space'] }}
        select_option:
          - variables:
              cards:
                'Dinosaur': yoto://card/7T89G
                'Enchanted': yoto://card/1yi0s
                'Outer Space': yoto://card/8Mr02
          - action: media_player.play_media
            target:
              entity_id: media_player.jodie
            data:
              media_content_id: "{{ cards[option] }}"
              media_content_type: music
      - name: Yoto Classics
        unique_id: yoto_classics
        icon: mdi:book-open-variant
        state: "{{ none }}"
        options: >
          {{ ['A Little Princess', 'Little Women', 'The Jungle Book', 'The Wonderful Wizard of Oz', 'Treasure Island'] }}
        select_option:
          - variables:
              cards:
                'A Little Princess': yoto://card/3Glyv
                'Little Women': yoto://card/gBDac
                'The Jungle Book': yoto://card/j8b4j
                'The Wonderful Wizard of Oz': yoto://card/97Weq
                'Treasure Island': yoto://card/eDwz6
          - action: media_player.play_media
            target:
              entity_id: media_player.jodie
            data:
              media_content_id: "{{ cards[option] }}"
              media_content_type: music
