# The kitchen iPad (iPad 9th gen, LCD) in the companion app's kiosk mode:
# screen brightness and screensaver through the day, back to Home when idle,
# a nightly reload, and charging from a smart plug between 40 and 60%. The
# iPad's own kiosk settings (start time, wake on camera motion) are in
# docs/ipad.md. Remote commands only reach the app while it's open and in
# the foreground, which is always the case in kiosk mode.
# Copy to /config/packages/ and reload template entities and automations.

template:
  # What the screen should be doing now. Night starts at 23:00, or midnight
  # on Friday and Saturday nights, and ends at 06:30, except on weekday
  # mornings, when the screen is awake from 05:10 for an early start (out of
  # the house at about 06:00); away is nobody home (Joris and Pauline; the
  # wall phone and iPad persons are devices, not people); an earthquake
  # beats everything.
  - sensor:
      - name: iPad kiosk phase
        unique_id: ipad_kiosk_phase
        icon: mdi:tablet-dashboard
        state: >
          {% set t = now().strftime('%H:%M') %}
          {% set bedtime = '24:00' if now().weekday() in [4, 5] else '23:00' %}
          {% if is_state('binary_sensor.wellington_earthquake', 'on') %}quake
          {% elif not (is_state('person.joris', 'home') or is_state('person.pauline', 'home')) %}away
          {% elif now().weekday() < 5 and '05:10' <= t < '06:30' %}morning
          {% elif t >= bedtime or t < '06:30' %}night
          {% elif is_state('sun.sun', 'below_horizon') %}evening
          {% else %}day{% endif %}

  # Battery-powered sensors, night lights and cameras under 20%, for the
  # System views' headers. Phones, the iPad and the house
  # battery are charged some other way, so they're left out.
  - sensor:
      - name: Low batteries
        unique_id: low_batteries
        icon: mdi:battery-alert-variant-outline
        unit_of_measurement: devices
        state: >
          {{ states.sensor
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'battery')
             | rejectattr('entity_id', 'search', 'home_battery|alphaess|plop|wallphone|ipad|iphone')
             | map(attribute='state') | select('is_number') | map('float')
             | select('lt', 20) | list | count }}
        attributes:
          devices: >
            {% set ns = namespace(out=[]) %}
            {% for s in states.sensor
                 | selectattr('attributes.device_class', 'defined')
                 | selectattr('attributes.device_class', 'eq', 'battery')
                 | rejectattr('entity_id', 'search', 'home_battery|alphaess|plop|wallphone|ipad|iphone')
                 if is_number(s.state) and s.state | float < 20 %}
              {% set ns.out = ns.out + [{'name': device_attr(s.entity_id, 'name_by_user')
                                                  or device_attr(s.entity_id, 'name') or s.name,
                                         'level': s.state | float | round | int}] %}
            {% endfor %}
            {{ ns.out | sort(attribute='level') }}

automation:
  # Brightness and screensaver for the phase. The screensaver starts after
  # the iPad's own inactivity timer; "dim" keeps the dashboard readable,
  # "blank" is black with the backlight at its lowest. An LCD doesn't burn
  # in, but a lower backlight runs cooler, which is what ages a battery that
  # sits on the charger.
  - id: ipad_kiosk_phase
    alias: iPad brightness and screensaver
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.ipad_kiosk_phase
        not_to: [unknown, unavailable]
        id: phase
      - trigger: state
        entity_id: binary_sensor.ipad_kiosk_mode
        to: "on"
      - trigger: homeassistant
        event: start
      # The screen's brightness is only set while it's awake (setting it under
      # the screensaver lights the screen up behind it), so set it on waking.
      - trigger: state
        entity_id: binary_sensor.ipad_kiosk_screensaver
        from: "on"
        to: "off"
    actions:
      - variables:
          phase: "{{ states('sensor.ipad_kiosk_phase') }}"
          settings:
            # Day and evening: the screensaver dims to the same level, so the
            # screen stays lit and still goes back to Home when idle.
            day: {brightness: 80, mode: dim, dim: 80}
            evening: {brightness: 40, mode: dim, dim: 40}
            night: {brightness: 20, mode: blank, dim: 0}
            morning: {brightness: 40, mode: dim, dim: 15}
            away: {brightness: 35, mode: blank, dim: 0}
            quake: {brightness: 100, mode: dim, dim: 40}
          s: "{{ settings.get(phase, settings.day) }}"
      - action: notify.mobile_app_ipad
        data:
          message: kiosk_set_screensaver_mode
          data:
            mode: "{{ s.mode }}"
      - action: notify.mobile_app_ipad
        data:
          message: kiosk_set_screensaver_brightness
          data:
            level: "{{ s.dim }}"
      - if:
          - condition: state
            entity_id: binary_sensor.ipad_kiosk_screensaver
            state: "off"
        then:
          - action: notify.mobile_app_ipad
            data:
              message: kiosk_set_brightness
              data:
                level: "{{ s.brightness }}"
      # Nobody home: go dark now instead of after the timer. A quake or a
      # weekday morning wakes it.
      - choose:
          - conditions: "{{ phase == 'away' and trigger.id == 'phase' }}"
            sequence:
              - action: notify.mobile_app_ipad
                data:
                  message: kiosk_show_screensaver
          - conditions: >
              {{ phase == 'quake' or (phase == 'morning' and trigger.id == 'phase') }}
            sequence:
              - action: notify.mobile_app_ipad
                data:
                  message: kiosk_hide_screensaver

  # Wake up for whoever just came home, except at night.
  - id: ipad_kiosk_arrival
    alias: iPad wakes when someone comes home
    triggers:
      - trigger: state
        entity_id: [person.joris, person.pauline]
        to: home
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.ipad_kiosk_phase
            state: night
    actions:
      - action: notify.mobile_app_ipad
        data:
          message: kiosk_hide_screensaver

  # Weekday mornings (05:10-06:30): keep the screen awake. The screensaver
  # still starts after the iPad's 2-minute timer, so dismiss it each time.
  - id: ipad_kiosk_morning_awake
    alias: iPad stays awake on weekday mornings
    triggers:
      - trigger: state
        entity_id: binary_sensor.ipad_kiosk_screensaver
        to: "on"
    conditions:
      - condition: state
        entity_id: sensor.ipad_kiosk_phase
        state: morning
    actions:
      - action: notify.mobile_app_ipad
        data:
          message: kiosk_hide_screensaver

  # Night: black after 5 minutes with nobody in front of the camera. The
  # iPad's own 2-minute timer doesn't always fire after camera motion wakes
  # it (it stayed lit 6 minutes at a time), so this is the backstop.
  - id: ipad_kiosk_night_black
    alias: iPad goes black at night
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ipad_kiosk_screensaver
        to: "off"
        for: "00:05:00"
      - trigger: state
        entity_id: binary_sensor.ipad_camera_motion
        to: "off"
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: sensor.ipad_kiosk_phase
        state: night
      - condition: state
        entity_id: binary_sensor.ipad_kiosk_screensaver
        state: "off"
        for: "00:05:00"
      - condition: state
        entity_id: binary_sensor.ipad_camera_motion
        state: "off"
        for: "00:05:00"
    actions:
      - action: notify.mobile_app_ipad
        data:
          message: kiosk_show_screensaver

  # Once the screensaver is up, go back to the configured dashboard (the
  # iPad's Home view), so nobody wakes it to the Kids tab left open. It
  # doesn't dismiss the screensaver.
  - id: ipad_kiosk_back_home
    alias: iPad returns to Home when idle
    triggers:
      - trigger: state
        entity_id: binary_sensor.ipad_kiosk_screensaver
        to: "on"
        for: "00:00:30"
    actions:
      - action: notify.mobile_app_ipad
        data:
          message: kiosk_default

  # A fresh page every night: a dashboard left open for days slowly gains
  # memory (charts redraw every few seconds).
  - id: ipad_kiosk_nightly_reload
    alias: iPad reloads the dashboard at night
    triggers:
      - trigger: time
        at: "04:00:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.ipad_kiosk_screensaver
        state: "on"
    actions:
      - action: notify.mobile_app_ipad
        data:
          message: kiosk_reload

  # The iPad 9th gen has no charge limit, and a lithium battery ages fastest
  # held full and warm. It ages slowest cycling shallowly around half charge,
  # so a smart plug ("iPad charger", switch.ipad_charger) keeps it between 40
  # and 60%: about two hours on battery, then 40 minutes charging. Does
  # nothing until that plug exists.
  #
  # Every 10 minutes it also checks the plug matches the battery, which
  # catches a missed trigger, a plug toggled by hand, or one back from a
  # power cut. If the battery stops reporting (unavailable, or no change in
  # 6 hours, which never happens with the screen on), it charges, so the
  # iPad never runs flat. If HA itself is down, the plug stays as it was: a
  # daily "on" schedule in the Tapo app is the backstop (docs/ipad.md).
  - id: ipad_charging
    alias: iPad charges between 40 and 60%
    mode: queued
    max: 3
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ipad_battery_level
        below: 41
      - trigger: numeric_state
        entity_id: sensor.ipad_battery_level
        above: 59
      - trigger: state
        entity_id: sensor.ipad_battery_level
        to: [unknown, unavailable]
        for: "00:30:00"
      - trigger: state
        entity_id: switch.ipad_charger
        from: unavailable
      - trigger: time_pattern
        minutes: /10
      - trigger: homeassistant
        event: start
    conditions:
      - "{{ states('switch.ipad_charger') in ['on', 'off'] }}"
    actions:
      - variables:
          low: 40
          high: 60
          level: "{{ states('sensor.ipad_battery_level') | float(-1) }}"
          stale: >
            {{ not has_value('sensor.ipad_battery_level')
               or now() - states.sensor.ipad_battery_level.last_changed
                  > timedelta(hours=6) }}
          plug_on: "{{ is_state('switch.ipad_charger', 'on') }}"
          # Between the two limits, keep doing what it was doing.
          charge: >
            {{ stale or level <= low or (plug_on and level < high) }}
      - if: "{{ charge != plug_on }}"
        then:
          - action: "switch.turn_{{ 'on' if charge else 'off' }}"
            target:
              entity_id: switch.ipad_charger

  # The plug is on but the iPad isn't charging: a loose cable or a dead
  # charger. Say so once per charge, while there's still battery left.
  - id: ipad_charger_check
    alias: iPad charger not charging
    triggers:
      - trigger: state
        entity_id: switch.ipad_charger
        to: "on"
        for: "00:20:00"
    conditions:
      - condition: state
        entity_id: sensor.ipad_battery_state
        state: Not Charging
      - "{{ has_value('sensor.ipad_battery_level') }}"
    actions:
      - action: notify.mobile_app_plop
        data:
          title: Kitchen iPad isn't charging
          message: >
            Its plug has been on for 20 minutes but the iPad says Not Charging
            ({{ states('sensor.ipad_battery_level') }}%). Check the cable and
            charger.
