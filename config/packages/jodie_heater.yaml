# Jodie's Goldair GPPH panel heater (Tuya Local, local at 192.168.168.54).
# It used to switch itself off in the morning through a schedule in the
# Goldair app; that went when it moved to Smart Life, so HA does it now.
#
# Two ways it goes wrong (seen 21-22 November 2026):
# - HA loses it: "Unable to Connect" every 10 minutes, unavailable for 11
#   hours, until HA restarted. The watchdog below reloads the entry instead.
# - The heater stops listening: its Wi-Fi module still answers, acks every
#   command and reports the last state, but the heater doesn't act on them
#   (and a reload doesn't help). Only switching it off at the wall clears
#   that.
# So the morning off doesn't rely on one command at 7:00: from 7:00 to 7:30
# it turns the heater off every 5 minutes for as long as it's on (and as
# soon as HA is back, if it restarted around 7), and at 7:30 it notifies if
# the heater still isn't off. Turning it on by hand before 7:30 gets it
# turned off again. The one thing HA can't do is cut its power: that needs
# a smart plug in front of it.
# Copy to /config/packages/ and reload automations.

automation:
  - id: jodie_heater_morning_off
    alias: Jodie's heater off in the morning
    description: Turns Jodie's heater off from 7:00, retrying every 5 minutes until 7:30.
    mode: single
    triggers:
      - trigger: time
        at: "07:00:00"
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
      # Back from unavailable (HA lost it, or a reload) while still on.
      - trigger: state
        entity_id: climate.heater_jodie
        to: heat
    conditions:
      - condition: time
        after: "07:00:00"
        before: "07:30:00"
      - condition: state
        entity_id: climate.heater_jodie
        state: heat
    actions:
      - action: climate.turn_off
        target:
          entity_id: climate.heater_jodie
      - wait_template: "{{ is_state('climate.heater_jodie', 'off') }}"
        timeout: "00:01:00"

  - id: jodie_heater_morning_check
    alias: Jodie's heater morning check
    description: Notifies at 7:30 if Jodie's heater still isn't off.
    mode: single
    triggers:
      - trigger: time
        at: "07:30:00"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.heater_jodie
            state: "off"
    actions:
      - action: notify.mobile_app_plop
        data:
          title: Jodie's heater is still on
          message: >-
            {%- if is_state('climate.heater_jodie', 'heat') %}
            It ignored half an hour of off commands and still says heat.
            Switch it off at the wall for a few seconds: that brings it back.
            {%- else %}
            HA can't reach it ({{ states('climate.heater_jodie') }}), so it
            may still be on. Check it, or switch it off at the wall.
            {%- endif %}

  - id: jodie_heater_watchdog
    alias: Jodie's heater watchdog
    description: Reconnects to Jodie's heater when it has been unavailable for 15 minutes, at most every 30 minutes.
    mode: single
    # A time pattern, like the Alpha ESS watchdog: after a restart it starts
    # out unavailable, with no state change to trigger on.
    triggers:
      - trigger: time_pattern
        minutes: /5
    conditions:
      - condition: state
        entity_id: climate.heater_jodie
        state:
          - unavailable
          - unknown
        for:
          minutes: 15
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or now() - this.attributes.last_triggered > timedelta(minutes=30) }}
    actions:
      - action: homeassistant.reload_config_entry
        target:
          entity_id: climate.heater_jodie

  # Its display lights up the room at night.
  - id: jodie_heater_display_off
    alias: Jodie's heater display off in the evening
    description: Turns the heater's display off at 20:30 if the heater is on.
    mode: single
    triggers:
      - trigger: time
        at: "20:30:00"
    conditions:
      - condition: state
        entity_id: climate.heater_jodie
        state: heat
    actions:
      - action: light.turn_off
        target:
          entity_id: light.heater_jodie_display
