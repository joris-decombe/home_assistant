# Wall-phone dashboard helpers: the hourly forecast sensor, the ceiling
# lights' Off / Night / Full control with its one-tap scripts, today's
# heat-pump energy, the battery's charge rate, the car charger's status and
# the dashboards' Charge now switch.
#
# Press feedback: the slow controls (ceiling lights, Charge now, the music
# moods, Yoto cards) go through a script that waits until the device has
# actually changed, and their dashboard entity shows an hourglass
# (mdi:timer-sand) or "Starting…" while that script runs. A tap shows at
# once, and a failed one ends the script, so it never sticks.
# The iPad dashboard uses them too. Loaded as a package: configuration.yaml on
# the Pi has `homeassistant: packages: !include_dir_named packages`. Copy this
# file to /config/packages/ and reload template entities.

template:
  # The next 24 hours of met.no forecast, trimmed to what the wind strip on the
  # wall-phone dashboard shows. Weather entities only expose forecasts through
  # weather.get_forecasts, so this refreshes it every 30 minutes. The
  # attribute is excluded from the recorder (see configuration.yaml).
  - trigger:
      - trigger: time_pattern
        minutes: /30
      - trigger: homeassistant
        event: start
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: hourly
        response_variable: hourly
    sensor:
      - name: Hourly forecast
        unique_id: wall_phone_hourly_forecast
        icon: mdi:weather-windy
        state: "{{ now().isoformat(timespec='minutes') }}"
        attributes:
          forecast: >
            {% set ns = namespace(out=[]) %}
            {% for f in hourly['weather.forecast_home'].forecast[:24] %}
              {% set ns.out = ns.out + [{
                'datetime': f.datetime,
                'condition': f.condition,
                'temperature': f.temperature,
                'wind_speed': f.wind_speed,
                'wind_bearing': f.wind_bearing,
                'precipitation': f.precipitation,
              }] %}
            {% endfor %}
            {{ ns.out }}

  # Ceiling lights as one Off / Night / Full control for the wall phone. Each
  # Yeelight ceiling light has a Day (main light) and Night (moonlight)
  # effect; the Xiaomi light group doesn't expose them, so this drives both
  # lights directly. The state is read back from the lights, so it stays
  # right when they're switched from the wall or the app.
  - select:
      - name: Ceiling lights
        unique_id: wall_phone_ceiling_lights_mode
        icon: >
          {% if is_state('script.ceiling_lights_toggle', 'on') or is_state('script.ceiling_lights_flip_mode', 'on') %}mdi:timer-sand
          {% else %}{{ {'Night': 'mdi:weather-night', 'Full': 'mdi:ceiling-light-multiple'}
                       .get(this.state, 'mdi:ceiling-light-multiple-outline') }}{% endif %}
        options: "{{ ['Off', 'Night', 'Full'] }}"
        state: >
          {% set on = ['light.yeelink_sg_594287415_ceiling22_s_2_light',
                       'light.yeelink_sg_594289920_ceiling22_s_2_light']
                      | select('is_state', 'on') | list %}
          {% if not on %}Off
          {% elif on | map('state_attr', 'effect') | select('eq', 'Night') | list | count == on | count %}Night
          {% else %}Full{% endif %}
        select_option:
          - variables:
              lights:
                - light.yeelink_sg_594287415_ceiling22_s_2_light
                - light.yeelink_sg_594289920_ceiling22_s_2_light
          - choose:
              - conditions: "{{ option == 'Off' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ lights }}"
              - conditions: "{{ option == 'Night' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ lights }}"
                    data:
                      effect: Night
            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ lights }}"
                data:
                  effect: Day
                  brightness_pct: 100

  # Heat-pump energy used today, for the wall phone. Only Living room and
  # Dining room report energy over ECHONET Lite (Hall's adapter doesn't).
  # The daily meters are utility_meter helpers created in the UI.
  - sensor:
      - name: Heat pumps today
        unique_id: wall_phone_heat_pumps_today
        icon: mdi:heat-pump
        unit_of_measurement: kWh
        device_class: energy
        state: >
          {{ (states('sensor.living_room_heat_pump_today') | float(0)
              + states('sensor.dining_room_heat_pump_today') | float(0)) | round(1) }}

  # The Alpha ESS battery's charge level, named after what it's doing
  # ("Charging 1.9 kW", "Discharging 640 W", "Battery idle") so the Battery
  # sensor card shows both. Battery I/O is negative while charging.
  - sensor:
      - name: >
          {% set w = states('sensor.alphaess_instantaneous_battery_i_o') | float(0) %}
          {% set p = '%.1f kW' | format(w | abs / 1000) if w | abs >= 1000
                     else '%d W' | format((w | abs / 10) | round * 10) %}
          {{ 'Charging ' ~ p if w < -20 else 'Discharging ' ~ p if w > 20 else 'Battery idle' }}
        unique_id: wall_phone_home_battery
        default_entity_id: sensor.home_battery
        unit_of_measurement: "%"
        device_class: battery
        icon: >
          {% set soc = states('sensor.alphaess_instantaneous_battery_soc') | float(0) %}
          {% set n = (soc / 10) | round | int * 10 %}
          {% if states('sensor.alphaess_instantaneous_battery_i_o') | float(0) < -20 %}
            {{ 'mdi:battery-charging-outline' if n == 0 else 'mdi:battery-charging-' ~ n }}
          {% else %}
            {{ 'mdi:battery-outline' if n == 0 else 'mdi:battery' if n == 100 else 'mdi:battery-' ~ n }}
          {% endif %}
        availability: "{{ has_value('sensor.alphaess_instantaneous_battery_soc') }}"
        state: "{{ states('sensor.alphaess_instantaneous_battery_soc') | float | round(1) }}"

  # The Evnex charger in one word or two ("Charging 7.2 kW", "Paused by car",
  # "Unplugged"), for the Car cards on the wall phone and iPad. While a tap on
  # Charge now is on its way: "Asking the charger…". The connector
  # status is OCPP's: suspended_ev means the car stopped taking power (full or
  # its own schedule), suspended_evse that the charger is holding off (its
  # off-peak schedule). Evnex polls its cloud, so it lags by up to ~5 minutes.
  - sensor:
      - name: Car charger
        unique_id: wall_phone_car_charger
        default_entity_id: sensor.car_charger
        icon: >
          {{ {'Paused by car': 'mdi:car-electric', 'Finished': 'mdi:car-electric',
              'Asking the charger…': 'mdi:timer-sand',
              'Waiting to charge': 'mdi:timer-sand', 'Starting': 'mdi:ev-plug-type2',
              'Plugged in': 'mdi:ev-plug-type2', 'Unplugged': 'mdi:power-plug-off-outline',
              'Fault': 'mdi:alert-circle-outline', 'Offline': 'mdi:cloud-off-outline'}
             .get(this.state, 'mdi:battery-charging' if this.state is string and this.state.startswith('Charging') else 'mdi:ev-station') }}
        state: >
          {% set c = 'sensor.garage_joris_home_charger_' %}
          {% set st = states(c ~ 'connector_status') %}
          {% if is_state('script.car_charge_now_on', 'on') or is_state('script.car_charge_now_off', 'on') %}Asking the charger…
          {% elif is_state(c ~ 'charger_network_status', 'offline') %}Offline
          {% elif st == 'charging' or is_state('binary_sensor.garage_joris_home_charger_charging', 'on') %}Charging {{ '%.1f' | format(states(c ~ 'metered_power') | float(0)) }} kW
          {% elif st == 'suspended_ev' %}Paused by car
          {% elif st == 'suspended_evse' %}Waiting to charge
          {% elif st == 'preparing' %}Starting
          {% elif st == 'finishing' %}Finished
          {% elif st == 'faulted' %}Fault
          {% elif is_state('binary_sensor.garage_joris_home_charger_plugged_in', 'on') %}Plugged in
          {% else %}Unplugged{% endif %}

  # Charge now for the dashboards. The Evnex switch only changes once its
  # cloud confirms (seconds, sometimes minutes), so a tap looked like it did
  # nothing. This one flips at once, with an hourglass until the charger has
  # followed (script.car_charge_now_on/off). The solar charging automations
  # use those scripts too, for their retries.
  #
  # A second tap within 5 seconds of the first is ignored: on 27 November
  # 2026 one tap on the iPad toggled twice (off, then on in the same second).
  - switch:
      - name: Charge now
        unique_id: car_charge_now
        default_entity_id: switch.car_charge_now
        icon: >
          {{ 'mdi:timer-sand' if is_state('script.car_charge_now_on', 'on')
             or is_state('script.car_charge_now_off', 'on') else 'mdi:lightning-bolt' }}
        availability: "{{ has_value('switch.garage_joris_home_charger_charge_now') }}"
        state: >
          {{ is_state('script.car_charge_now_on', 'on')
             or (is_state('switch.garage_joris_home_charger_charge_now', 'on')
                 and not is_state('script.car_charge_now_off', 'on')) }}
        turn_on:
          - condition: template
            value_template: >
              {{ now() - (state_attr('script.car_charge_now_off', 'last_triggered')
                           or now() - timedelta(minutes=1)) > timedelta(seconds=5) }}
          - action: script.turn_on
            target:
              entity_id: script.car_charge_now_on
        turn_off:
          - condition: template
            value_template: >
              {{ now() - (state_attr('script.car_charge_now_on', 'last_triggered')
                           or now() - timedelta(minutes=1)) > timedelta(seconds=5) }}
          - action: script.turn_on
            target:
              entity_id: script.car_charge_now_off

script:
  # Charge now on/off for switch.car_charge_now and the solar charging
  # automations: each cancels the other, then asks the charger up to three
  # times, a minute apart, until the Evnex switch shows it. Evnex's cloud
  # sometimes times out (ReadTimeout, 27 November 2026), and that error
  # isn't one continue_on_error catches, so each request runs in its own
  # script (car_charge_now_send), whose failure doesn't stop these.
  car_charge_now_on:
    alias: Charge now on
    icon: mdi:lightning-bolt
    mode: restart
    sequence:
      - action: script.turn_off
        target:
          entity_id: script.car_charge_now_off
      - repeat:
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.car_charge_now_send
              data:
                variables:
                  turn: "on"
            - wait_template: "{{ is_state('switch.garage_joris_home_charger_charge_now', 'on') }}"
              timeout: "00:01:00"
          until:
            - condition: template
              value_template: >
                {{ is_state('switch.garage_joris_home_charger_charge_now', 'on') or repeat.index >= 3 }}
      - wait_template: "{{ is_state('switch.garage_joris_home_charger_charge_now', 'on') }}"
        timeout: "00:02:00"

  car_charge_now_off:
    alias: Charge now off
    icon: mdi:lightning-bolt-outline
    mode: restart
    sequence:
      - action: script.turn_off
        target:
          entity_id: script.car_charge_now_on
      - repeat:
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.car_charge_now_send
              data:
                variables:
                  turn: "off"
            - wait_template: "{{ is_state('switch.garage_joris_home_charger_charge_now', 'off') }}"
              timeout: "00:01:00"
          until:
            - condition: template
              value_template: >
                {{ is_state('switch.garage_joris_home_charger_charge_now', 'off') or repeat.index >= 3 }}
      - wait_template: "{{ is_state('switch.garage_joris_home_charger_charge_now', 'off') }}"
        timeout: "00:02:00"

  # One request to the Evnex cloud, on its own so a timeout only ends this.
  car_charge_now_send:
    alias: Charge now request
    icon: mdi:cloud-upload-outline
    mode: restart
    fields:
      turn:
        description: '"on" or "off"'
    sequence:
      - action: "switch.turn_{{ turn }}"
        target:
          entity_id: switch.garage_joris_home_charger_charge_now

  # One tap on the wall phone's ceiling-light card: both lights on (in their
  # last mode) or both off. Both ceiling scripts wait (up to 20 s) for the
  # lights to report the change, for the card's hourglass.
  ceiling_lights_toggle:
    alias: Ceiling lights on/off
    icon: mdi:ceiling-light-multiple
    sequence:
      - variables:
          was: "{{ states('select.ceiling_lights') }}"
      - if: "{{ is_state('select.ceiling_lights', 'Off') }}"
        then:
          - action: light.turn_on
            target:
              entity_id:
                - light.yeelink_sg_594287415_ceiling22_s_2_light
                - light.yeelink_sg_594289920_ceiling22_s_2_light
        else:
          - action: select.select_option
            target:
              entity_id: select.ceiling_lights
            data:
              option: "Off"
      - wait_template: "{{ states('select.ceiling_lights') != was }}"
        timeout: 20

  # One tap on the card's icon: Night <-> Full (Night when off).
  ceiling_lights_flip_mode:
    alias: Ceiling lights night/full
    icon: mdi:weather-night
    sequence:
      - variables:
          option: "{{ 'Full' if is_state('select.ceiling_lights', 'Night') else 'Night' }}"
      - action: select.select_option
        target:
          entity_id: select.ceiling_lights
        data:
          option: "{{ option }}"
      - wait_template: "{{ is_state('select.ceiling_lights', option) }}"
        timeout: 20
